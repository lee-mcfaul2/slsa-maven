# Generated by slsa-maven
# {{GENERATOR_URL}} @ {{GENERATOR_SHA}}
#
# Derives a reproducible Dockerfile for this project by tracing a
# real, successful Maven build and pinning every byte that went
# into it: every apt package the build touched, plus every jar /
# pom / module file Maven resolved from Central.
#
# How it works:
#   1. Boot a SHA-pinned ubuntu container with apt sources
#      redirected to snapshot.ubuntu.com at a pinned timestamp.
#      Every apt byte is addressable by digest + snapshot URL.
#   2. Install JDK + Maven (versions either taken from the pom or
#      defaulted to newest LTS) so `mvn verify source:jar
#      javadoc:jar` can actually run.
#   3. Run that build under `strace -f -e openat,execve` and
#      capture every file path the build opens or executes.
#   4. Map each absolute path to its owning Debian package via
#      `dpkg -S`. The result is the exact apt set the build
#      depends on.
#   5. Walk ~/.m2/repository (populated entirely by this run, since
#      the container started empty) and emit a SHA256 + Central URL
#      pin for every jar / pom / module file Maven downloaded.
#   6. Emit a Dockerfile that downloads each apt .deb from the
#      pinned snapshot AND each Maven artifact from
#      repo1.maven.org, verifies SHA256 on every byte, then
#      installs the apt set and pre-populates the Maven local
#      repo. The image is then truly self-contained — release-time
#      `mvn -o` (offline) succeeds without network.
#   7. Commit the Dockerfile to this branch if it changed.
#
# Triggers:
#   - on push to any branch when scan.yml itself is modified
#   - workflow_dispatch for on-demand refresh
#
# slsa-maven never adds or modifies project-side files outside of
# `Dockerfile` and `.github/workflows/`.

name: Scan and pin Dockerfile

on:
  push:
    # Branches only — a tag push touching scan.yml would fire in
    # detached HEAD with no branch to push the regenerated
    # Dockerfile back to.
    branches: ['**']
    paths:
      - '.github/workflows/scan.yml'
  workflow_dispatch:
    inputs:
      snapshot_ts:
        description: 'Ubuntu snapshot timestamp (YYYYMMDDTHHMMSSZ)'
        required: false
        default: ''
      apt_mirror_url:
        # Override the apt mirror URL prefix. Defaults to
        # snapshot.ubuntu.com at the pinned SNAPSHOT_TS. Set this
        # when running against an internal Artifactory / proxy
        # cache that wraps snapshot.ubuntu.com (companies running
        # behind a corporate cache, or anyone working around the
        # public mirror's rate limit on shared CI IP pools).
        # The URL must end with a trailing slash; the workflow
        # appends `<release> main restricted universe multiverse`.
        # Maven Central is NOT mirrored here — Central isn't rate-
        # limited and is content-addressable, so the curl URLs in
        # the emitted Dockerfile always go to repo1.maven.org.
        description: 'Override apt mirror URL prefix (e.g. http://artifactory:8081/.../snapshot-cache/). Empty = snapshot.ubuntu.com'
        required: false
        default: ''
      dry_run:
        # When true, generate Dockerfile.new on disk for
        # inspection but do NOT commit or push. Use this when
        # running the workflow locally (e.g. via act against a
        # laptop Artifactory) so the resulting test Dockerfile —
        # which would carry the override URL baked in — never
        # reaches the remote. Combine with apt_mirror_url to
        # exercise the scan against an internal cache without
        # leaking the cache URL upstream.
        description: 'Generate Dockerfile but skip commit/push. Use for local act runs.'
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  # Step 1: pick the Ubuntu base release and the JDK package to
  # install based on the pom's declared requirements. Runs on a
  # bare runner because the scan container is the thing being
  # chosen — can't choose your own image from inside it.
  resolve:
    name: Resolve target Ubuntu base and JDK from pom.xml
    runs-on: ubuntu-24.04
    # 30 min, not 10. The apt-get update + install step uses
    # GitHub's default ubuntu archive mirror, which periodically
    # rate-limits or runs slow when many concurrent runners on the
    # same fork hit it (e.g. when the target repo has its own busy
    # CI suite firing on the same push). Hitting the timeout
    # cancels the whole workflow run; 30 min absorbs realistic
    # transient slowness without masking a real hang.
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      release: ${{ steps.pick.outputs.release }}
      image_digest: ${{ steps.digest.outputs.digest }}
      jdk_major: ${{ steps.pick.outputs.jdk_major }}
      jdk_package: ${{ steps.pick.outputs.jdk_package }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install resolver tools
        # Retry pattern matching the scan job's apt installs — when
        # archive.ubuntu.com is throttling or just slow under
        # concurrent-runner pressure, the first attempt can stall
        # past several minutes. 6 attempts × exponential backoff
        # gives ~63 min worst-case but each attempt is fast on a
        # warm mirror. Acquire timeout = 30s caps individual fetch
        # stalls so retries can take over.
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            # Bracket apt-get with set +e/-e — same reason as the
            # scan job's apt_install: a failed pipeline trips
            # set -euo pipefail before the retry-check runs.
            set +e
            sudo apt-get -o Acquire::http::Timeout=30 \
                         -o Acquire::Retries=3 \
                         update -qq 2>&1 | tee /tmp/apt-update.log
            rc=${PIPESTATUS[0]}
            set -e
            if [ "${rc}" = "0" ] && ! grep -q 'Failed to fetch' /tmp/apt-update.log; then
              break
            fi
            if [ "${attempt}" = "6" ]; then
              echo "ERROR: apt-get update kept failing across 6 attempts" >&2
              exit 1
            fi
            backoff=$((30 * attempt))
            echo "apt-get update attempt ${attempt} slow/failed; sleeping ${backoff}s" >&2
            sleep "${backoff}"
          done
          sudo apt-get -o Acquire::http::Timeout=30 \
                       -o Acquire::Retries=3 \
                       install -y --no-install-recommends \
                       libxml2-utils

      - name: Pick JDK and base release from pom.xml
        id: pick
        # Resolution order:
        #   1. maven-enforcer-plugin <requireJavaVersion>
        #      <version>…</version> — a real build-time pin.
        #      Honoured exactly.
        #   2. <prerequisites><jdk>…</jdk></prerequisites> —
        #      deprecated but still seen. Treated as a minimum.
        #   3. maven-toolchains-plugin <jdkToolchain> with a
        #      <version> selector — explicit pin.
        #   4. Fall back to newest LTS available in the chosen
        #      Ubuntu base.
        #
        # Profile-activation <jdk>[N,)</jdk> blocks are NOT
        # considered: those gate a profile if the JDK happens to
        # be N+, they're not requirements that the build must
        # have JDK N. Treating them as pins would force adopters
        # onto unnecessarily-new JDKs.
        run: |
          set -euo pipefail

          # Hardcoded LTS-newest-first list. Adding a new LTS
          # (or a hypothetical future "resolute" 26.04) is a
          # one-line edit and guarantees a human reviewed it.
          # Non-LTS releases follow as a fallback in case the
          # newest LTS doesn't carry the JDK package the project
          # asked for.
          LTS=(resolute noble jammy)
          NONLTS=(plucky oracular)
          RELEASE_ORDER=("${LTS[@]}" "${NONLTS[@]}")

          [ -f pom.xml ] || { echo "ERROR: pom.xml not found at repo root" >&2; exit 1; }

          # XPath helpers — local-name() is needed because Maven
          # POMs declare a default namespace.
          xp() { xmllint --xpath "$1" pom.xml 2>/dev/null || true; }

          # 1. requireJavaVersion. Two layouts in the wild:
          #    a) enforcer rules under <configuration><rules>
          #    b) enforcer rules under <executions>/<execution>/<configuration>/<rules>
          # We grep across both by walking the whole document.
          REQ=$(xp '//*[local-name()="requireJavaVersion"]/*[local-name()="version"]/text()')

          # 2. <prerequisites><jdk>
          PRE=$(xp '/*[local-name()="project"]/*[local-name()="prerequisites"]/*[local-name()="jdk"]/text()')

          # 3. <toolchains> jdk version selector (maven-toolchains-plugin)
          TC=$(xp '//*[local-name()="toolchains"]//*[local-name()="jdk"]/*[local-name()="version"]/text()')

          PINNED=""
          PINNED_SOURCE=""
          for src_pair in "REQ:requireJavaVersion" "PRE:prerequisites/jdk" "TC:toolchains/jdk"; do
            var=${src_pair%%:*}
            label=${src_pair#*:}
            val="${!var}"
            [ -z "${val}" ] && continue
            # Strip whitespace, brackets, and "1." (legacy form: "1.8" → 8).
            cleaned=$(echo "${val}" | tr -d '[]() ' | sed -E 's/^1\.//' | grep -oE '[0-9]+' | head -1 || true)
            if [ -n "${cleaned}" ]; then
              PINNED="${cleaned}"
              PINNED_SOURCE="${label}"
              break
            fi
          done

          # JDK_MAJOR is the version we'll install; package name is
          # `openjdk-${JDK_MAJOR}-jdk`. Default = current LTS Java =
          # JDK 21 as of writing. Update together: when JDK 25 rolls
          # into the LTS slot in the base release we resolve to,
          # bump this default.
          if [ -n "${PINNED}" ]; then
            JDK_MAJOR="${PINNED}"
            echo "Pom pin found: ${PINNED_SOURCE} → JDK ${JDK_MAJOR}"
          else
            JDK_MAJOR=21
            echo "No pom-side JDK pin; defaulting to JDK ${JDK_MAJOR} (current LTS)"
          fi
          JDK_PACKAGE="openjdk-${JDK_MAJOR}-jdk"

          # Now find an Ubuntu release that has both `maven` and
          # the chosen JDK package. apt-cache madison would be
          # authoritative but requires apt sources for each
          # candidate release in scope; instead we trust the
          # well-known availability map below and let the trace
          # step fail loudly if it's wrong (pinning will surface
          # a missing package).
          # Conservative defaults; if a project wants a JDK older
          # or newer than the LTS allows, the operator edits the
          # JDK pin in pom.xml or overrides on dispatch.
          PICKED=""
          case "${JDK_MAJOR}" in
            8|11|17|21)
              # Stock packages on every modern LTS.
              for r in "${RELEASE_ORDER[@]}"; do PICKED="${r}"; break; done
              ;;
            25)
              # Newest LTS Java; available on the most recent
              # Ubuntu releases. Walk newest-first; non-LTS
              # gets included via RELEASE_ORDER if the LTS
              # doesn't carry it yet.
              for r in resolute plucky oracular noble; do PICKED="${r}"; break; done
              ;;
            *)
              # Other major versions (10, 12, 13, …): treat as
              # specialist requests — apt-cache lookup at scan
              # time will catch missing packages.
              for r in "${RELEASE_ORDER[@]}"; do PICKED="${r}"; break; done
              ;;
          esac

          [ -n "${PICKED}" ] || { echo "ERROR: no Ubuntu release picked" >&2; exit 1; }

          {
            echo "release=${PICKED}"
            echo "jdk_major=${JDK_MAJOR}"
            echo "jdk_package=${JDK_PACKAGE}"
          } >> "$GITHUB_OUTPUT"
          echo "Picked: ubuntu:${PICKED} + ${JDK_PACKAGE}"

      - name: Resolve image digest for picked release
        id: digest
        # docker pull + inspect turns a tag into an immutable
        # digest. The scan container's image: field below pins by
        # digest so it can't drift between resolve and scan.
        run: |
          set -euo pipefail
          docker pull "ubuntu:${{ steps.pick.outputs.release }}" >/dev/null
          DIGEST=$(docker inspect \
            --format='{{index .RepoDigests 0}}' \
            "ubuntu:${{ steps.pick.outputs.release }}" \
            | sed 's/.*@//')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Image digest: ${DIGEST}"

  scan:
    name: Trace build and emit pinned Dockerfile
    needs: resolve
    runs-on: ubuntu-24.04
    container:
      image: ubuntu@${{ needs.resolve.outputs.image_digest }}
    defaults:
      run:
        shell: bash
    # 180 min, not 75. Large reactors (keycloak: 143-module
    # default reactor with frontend builds + per-module javadoc)
    # routinely take ≥75 min for the strace step alone, before
    # the m2 walk + Dockerfile emit. GHA hard-caps individual
    # jobs at 360 min so 180 leaves real margin. Smaller projects
    # complete much sooner — the cap only matters for slow ones.
    timeout-minutes: 180
    permissions:
      # Push the emitted Dockerfile back to this branch.
      contents: write
      # Dispatch build-container.yml after committing — commits
      # made by the default GITHUB_TOKEN don't fire push-triggered
      # workflows (anti-recursion), so we trigger explicitly.
      actions: write

    env:
      # The snapshot timestamp controls which version of every apt
      # package enters the Dockerfile. Bump to pick up security
      # updates / newer toolchain. The snapshot is a separate axis
      # from the tagged-commit timestamp; SOURCE_DATE_EPOCH at
      # release time tracks the tag, this knob tracks the build
      # environment freeze.
      SNAPSHOT_TS: ${{ inputs.snapshot_ts != '' && inputs.snapshot_ts || '20260425T120000Z' }}
      # Override URL. If empty, the workflow uses the public
      # snapshot.ubuntu.com default. Used for Artifactory proxies
      # / internal apt caches / working around the public mirror's
      # rate-limiting on shared CI IP pools. Threaded through both
      # the live scan and the emitted Dockerfile.
      APT_MIRROR_URL_OVERRIDE: ${{ inputs.apt_mirror_url }}
      # Dry-run flag: when 'true', the scan job emits Dockerfile.new
      # on disk for inspection but skips the git commit and push
      # steps. Lets local act runs exercise the full scan against
      # an internal Artifactory without the IP-laden test
      # Dockerfile reaching the remote.
      DRY_RUN: ${{ inputs.dry_run }}
      RELEASE: ${{ needs.resolve.outputs.release }}
      IMAGE_DIGEST: ${{ needs.resolve.outputs.image_digest }}
      JDK_MAJOR: ${{ needs.resolve.outputs.jdk_major }}
      JDK_PACKAGE: ${{ needs.resolve.outputs.jdk_package }}
      # Maven from archive.apache.org. apt's maven (3.8.7 on noble
      # LTS) is too old to satisfy modern projects' enforcer rules
      # (commons-lang3 requires [3.9,), and Ubuntu LTS doesn't track
      # upstream Maven release cadence). Pin a specific version +
      # SHA512 here, same content-addressable model as cosign in
      # build-container.yml. Bump together when refreshing
      # slsa-maven; archive.apache.org/dist/maven/maven-3/ lists
      # available versions and ships .sha512 files alongside each
      # tarball.
      MVN_VERSION: '3.9.15'
      MVN_SHA512: '33d81e0ec785f0207e3e5e3ffb61863e1dca5784c15ac3fb5ff105f69cffbea484eb8d473ea60467a63f7b0570eef8622f2fed8eee96acbe668aa313391cddb3'

    steps:
      - name: Bootstrap git (pre-checkout)
        # Minimal ubuntu base has no git, which forces
        # actions/checkout into a REST-API fallback with no .git/
        # — breaks the later commit-back step.
        shell: sh
        run: |
          set -e
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Pin apt sources
        run: |
          set -euo pipefail
          # Bootstrap ca-certificates from the default HTTP archive
          # before swapping to the (HTTPS-only) snapshot mirror.
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates

          # Resolve the apt mirror URL: dispatch override wins,
          # else default to public snapshot.ubuntu.com at the
          # pinned SNAPSHOT_TS. Persist to $GITHUB_ENV so the
          # Dockerfile-emit step bakes the same URL.
          if [ -n "${APT_MIRROR_URL_OVERRIDE}" ]; then
            APT_MIRROR_URL="${APT_MIRROR_URL_OVERRIDE}"
            echo "Using apt mirror override: ${APT_MIRROR_URL}"
          else
            APT_MIRROR_URL="https://snapshot.ubuntu.com/ubuntu/${SNAPSHOT_TS}/"
            echo "Using public snapshot mirror: ${APT_MIRROR_URL}"
          fi
          echo "APT_MIRROR_URL=${APT_MIRROR_URL}" >> "$GITHUB_ENV"

          cat > /etc/apt/sources.list <<APT
          deb ${APT_MIRROR_URL} ${RELEASE} main restricted universe multiverse
          deb ${APT_MIRROR_URL} ${RELEASE}-updates main restricted universe multiverse
          deb ${APT_MIRROR_URL} ${RELEASE}-security main restricted universe multiverse
          APT
          rm -f /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list
          # snapshot.ubuntu.com aggressively rate-limits the GitHub
          # Actions runner shared egress IP pool. 503s here are
          # throttling, not outage. Apt's per-fetch retries handle
          # single-blip transients; rate-limit cool-off needs
          # minutes — hence the exponential outer retry.
          for attempt in 1 2 3 4 5 6; do
            # Bracket apt-get with set +e/-e — same reason as the
            # Install bootstrap toolchain step: a failed pipeline
            # under set -euo pipefail aborts before the
            # Failed-to-fetch check, defeating the retry.
            set +e
            apt-get -o Acquire::Retries=5 -o Acquire::http::Pipeline-Depth=1 \
                    update 2>&1 | tee /tmp/apt-update.log
            rc=${PIPESTATUS[0]}
            set -e
            if [ "${rc}" = "0" ] && ! grep -q 'Failed to fetch' /tmp/apt-update.log; then
              break
            fi
            if [ "${attempt}" = "6" ]; then
              echo "ERROR: apt-get update against snapshot.ubuntu.com kept failing across 6 attempts" >&2
              echo "       Almost certainly GitHub Actions runner IP rate-limiting." >&2
              echo "       Re-run in 30-60 minutes, or move scan.yml to a self-hosted runner." >&2
              grep '^W:' /tmp/apt-update.log >&2 || true
              exit 1
            fi
            backoff=$((60 * (1 << (attempt - 1))))
            echo "snapshot.ubuntu.com 503 — known GHA-runner rate-limiting." >&2
            echo "Sleeping ${backoff}s before update retry $((attempt + 1))/6." >&2
            sleep "${backoff}"
          done

      - name: Install bootstrap toolchain
        # Generous default set: JDK + tracing/packaging tools.
        # Maven is NOT installed here — apt's noble package is
        # 3.8.7 which fails most projects' requireMavenVersion
        # enforcer rules. Maven comes from archive.apache.org in
        # the next step.
        # Anything unused by the project simply doesn't show up in
        # the strace output and won't land in the emitted
        # Dockerfile.
        run: |
          set -euo pipefail
          apt_install() {
            for attempt in 1 2 3 4 5 6; do
              # Bracket apt-get with set +e/-e so a failed pipeline
              # doesn't trip the outer set -euo pipefail before the
              # retry-loop check runs. Without this, the first 503
              # / 502 cluster from snapshot.ubuntu.com kills the
              # whole script — the retry loop never gets a chance.
              set +e
              apt-get -o Acquire::Retries=5 -o Acquire::http::Pipeline-Depth=1 \
                      install -y --no-install-recommends "$@" 2>&1 \
                | tee /tmp/apt-install.log
              rc=${PIPESTATUS[0]}
              set -e
              if [ "${rc}" = "0" ] && ! grep -q 'Failed to fetch' /tmp/apt-install.log; then
                return 0
              fi
              if [ "${attempt}" = "6" ]; then
                echo "ERROR: apt-get install kept failing across 6 attempts" >&2
                grep -E '^E:|^W:' /tmp/apt-install.log >&2 || true
                return 1
              fi
              backoff=$((60 * (1 << (attempt - 1))))
              echo "snapshot.ubuntu.com 503/502 — known GHA-runner rate-limiting; sleeping ${backoff}s." >&2
              sleep "${backoff}"
            done
          }
          # libicu's package name embeds the version, which moves
          # with Ubuntu releases (libicu74 on noble, libicu76+ on
          # resolute). Detect the highest-versioned libicuNN
          # available on the picked release rather than hardcoding.
          # Required because the .NET runtime (used by kiota in
          # frontend builds) hard-fails on missing ICU.
          ICU_PKG=$(apt-cache search --names-only '^libicu[0-9]+$' 2>/dev/null \
                    | awk '{print $1}' | sort -V | tail -1)
          if [ -z "${ICU_PKG}" ]; then
            echo "WARNING: no libicuNN found in apt; .NET-using build steps may fail" >&2
            ICU_PKG=""
          else
            echo "Detected ICU package: ${ICU_PKG}"
          fi

          apt_install \
            "${JDK_PACKAGE}" \
            strace \
            dpkg-dev \
            git \
            ca-certificates \
            curl \
            file \
            xz-utils \
            gzip \
            zip \
            unzip \
            tar \
            libxml2-utils \
            jq \
            ${ICU_PKG}
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

          # JAVA_HOME for the rest of this job AND for the emitted
          # Dockerfile. apt's openjdk-${MAJOR}-jdk lays out at
          # /usr/lib/jvm/java-${MAJOR}-openjdk-amd64. mvn finds its
          # own JDK fine without this, but maven-javadoc-plugin
          # shells out to `javadoc` and looks specifically at
          # JAVA_HOME — without it, every javadoc:jar invocation
          # fails with "JAVA_HOME is not correctly set". Some apt-
          # installed JDKs don't export it system-wide.
          JAVA_HOME="/usr/lib/jvm/java-${JDK_MAJOR}-openjdk-amd64"
          if [ ! -x "${JAVA_HOME}/bin/javadoc" ]; then
            echo "ERROR: expected javadoc at ${JAVA_HOME}/bin/javadoc, not found" >&2
            ls -la /usr/lib/jvm/ >&2 || true
            exit 1
          fi
          echo "JAVA_HOME=${JAVA_HOME}" >> "$GITHUB_ENV"
          echo "JAVA_HOME pinned to ${JAVA_HOME} for the rest of this job and the emitted Dockerfile."

          # Pin a UTF-8 locale. Stripped ubuntu base images default
          # to LANG=C, which makes the JVM's default charset US-ASCII
          # — any test that touches non-ASCII filenames or string
          # contents (e.g. Apache Maven's PluginParameterExpression
          # tests, which exercise unicode plugin parameters) blows
          # up with InvalidPathException. C.UTF-8 is the locale the
          # GHA runner default ships and what real user systems use.
          echo "LANG=C.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=C.UTF-8" >> "$GITHUB_ENV"

      - name: Install Maven from archive.apache.org
        # SHA512-pinned download. Apache's archive is content-
        # addressable + immutable like Maven Central, so the SHA
        # pin is durable indefinitely. tar -xzf with --strip-
        # components=1 lays /opt/maven/{bin,lib,...} directly so
        # the symlink path is stable across version bumps.
        run: |
          set -euo pipefail
          MVN_TGZ=/tmp/apache-maven-${MVN_VERSION}-bin.tar.gz
          curl -fsSL \
            "https://archive.apache.org/dist/maven/maven-3/${MVN_VERSION}/binaries/apache-maven-${MVN_VERSION}-bin.tar.gz" \
            -o "${MVN_TGZ}"
          echo "${MVN_SHA512}  ${MVN_TGZ}" | sha512sum -c -
          mkdir -p /opt/maven
          tar -xzf "${MVN_TGZ}" -C /opt/maven --strip-components=1
          ln -sf /opt/maven/bin/mvn /usr/local/bin/mvn
          mvn -v | head -3

      - name: Run Maven build under strace
        id: trace
        # Maven's local repo defaults to ~/.m2/repository. We
        # override to a fixed in-workspace path so the post-build
        # walk has a known location regardless of $HOME quirks
        # inside containers.
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          mkdir -p /tmp/scan
          # Fresh repo every run — anything Maven writes here
          # came from this build, nothing carried over.
          export M2_REPO="${GITHUB_WORKSPACE}/.m2-scan"
          rm -rf "${M2_REPO}"
          mkdir -p "${M2_REPO}"

          # Build command. -B (batch mode, no ANSI / progress
          # spinners). source:jar + javadoc:jar are explicit
          # because plain `verify` doesn't always trigger them
          # (depends on parent pom configuration). The trailing
          # help:evaluate is a no-op probe that ensures
          # maven-help-plugin lands in the local repo — release.yml
          # uses it offline to read project.artifactId and
          # project.version, so it has to be cached by the scan.
          #
          # Skip flags:
          #   -Drat.skip=true       — apache-rat-plugin is bound to
          #                           verify and runs license-header
          #                           checks. Many projects (Apache
          #                           Maven itself) require a
          #                           profile like -Papache-release
          #                           to configure RAT correctly;
          #                           the default config flags
          #                           hundreds of legitimate files.
          #                           Scan is a cache builder, not a
          #                           license gate — let the
          #                           project's own CI handle that.
          BUILD_CMD="mvn -B -Dmaven.repo.local=${M2_REPO} -Drat.skip=true verify source:jar javadoc:jar && mvn -B -Dmaven.repo.local=${M2_REPO} -q -DforceStdout help:evaluate -Dexpression=project.artifactId"
          echo "Build command: ${BUILD_CMD}"

          # Trace. -f follows forks (Maven forks compiler / surefire
          # / javadoc tool processes), openat + execve filter
          # captures every file path opened and binary executed.
          # read/write are excluded — they happen on already-open
          # fds and add noise.
          strace -f -e trace=openat,execve -o /tmp/scan/trace.log \
                 bash -c "${BUILD_CMD}" \
            || { echo "Build under strace FAILED."; \
                 tail -200 /tmp/scan/trace.log || true; \
                 exit 1; }

          echo "trace_lines=$(wc -l < /tmp/scan/trace.log)" >> "$GITHUB_OUTPUT"
          echo "Trace: $(wc -l < /tmp/scan/trace.log) lines"
          echo "M2 repo populated with $(find "${M2_REPO}" -type f ! -name '*.sha1' ! -name '*.md5' ! -name '*.sha256' ! -name '*.sha512' ! -name '_remote.repositories' ! -name '*.lastUpdated' ! -name 'resolver-status.properties' | wc -l) artifact files"

      - name: Extract apt paths from trace
        run: |
          set -euo pipefail
          awk '
            /execve\("/  { match($0, /execve\("[^"]+"/);
                           if (RSTART>0) {
                             p = substr($0, RSTART+8, RLENGTH-9); print p
                           } }
            /openat\(/   { match($0, /"[^"]+"/);
                           if (RSTART>0) {
                             p = substr($0, RSTART+1, RLENGTH-2);
                             if (substr(p,1,1) == "/") print p
                           } }
          ' /tmp/scan/trace.log \
            | sort -u \
            > /tmp/scan/paths.raw.txt

          # Exclude paths that can't be in an apt package. Workspace
          # paths and m2 repo paths are excluded first — they're
          # build outputs and Maven artifacts respectively, neither
          # belongs to a .deb. The ||true on each grep guards
          # against pipefail when a filter matches every line.
          { grep -vE '^(/tmp/|/proc/|/dev/|/sys/|/run/|/home/|/root/|/var/|/__w/|/github/|\.)' \
              /tmp/scan/paths.raw.txt || true; } \
            | { grep -vE "^${GITHUB_WORKSPACE}" || true; } \
            | sort -u \
            > /tmp/scan/paths.txt

          echo "Raw paths: $(wc -l < /tmp/scan/paths.raw.txt)"
          echo "Filtered:  $(wc -l < /tmp/scan/paths.txt)"

      - name: Map paths to apt packages
        run: |
          set -euo pipefail
          # dpkg -S takes a path and prints "pkg[,pkg]: /path".
          # Many traced paths won't belong to any package (kernel
          # interfaces, JDK-internal generated classes, etc.) —
          # dpkg exits 1 for those. Swallow xargs's non-zero exit
          # so the pipeline only fails if a later stage fails.
          { xargs -a /tmp/scan/paths.txt -L 100 dpkg -S 2>/dev/null || true; } \
            | awk -F: '{print $1}' \
            | tr ',' '\n' \
            | sed 's/^ *//;s/ *$//' \
            | { grep -v '^$' || true; } \
            | sort -u \
            > /tmp/scan/direct-packages.txt
          # Strip architecture suffix (pkg:amd64 → pkg).
          sed -i 's/:.*$//' /tmp/scan/direct-packages.txt

          # Always-required: git is needed for the safe.directory
          # config in the emitted Dockerfile and for any release-
          # time git operation; ca-certificates is needed for
          # cosign sign-blob; curl ditto. libxml2-utils + jq are
          # used by release.yml's discover step to walk the pom
          # hierarchy and emit the matrix JSON — Maven itself
          # doesn't invoke either, so the strace pass won't pick
          # them up.
          {
            echo 'git'
            echo 'ca-certificates'
            echo 'curl'
            echo 'libxml2-utils'
            echo 'jq'
          } >> /tmp/scan/direct-packages.txt
          sort -u -o /tmp/scan/direct-packages.txt /tmp/scan/direct-packages.txt

          if [ ! -s /tmp/scan/direct-packages.txt ]; then
            echo "ERROR: zero packages mapped from $(wc -l < /tmp/scan/paths.txt) paths."
            exit 1
          fi
          echo "Direct packages: $(wc -l < /tmp/scan/direct-packages.txt)"

          # Expand to the full transitive closure. Required because
          # the emitted Dockerfile installs the pinned set via
          # `apt-get install ./*.deb` with the snapshot sources
          # already deleted — anything declared in a control file's
          # Depends / Pre-Depends has to be present locally.
          apt-cache depends --recurse \
              --no-recommends --no-suggests \
              --no-conflicts --no-breaks \
              --no-replaces --no-enhances \
              $(cat /tmp/scan/direct-packages.txt) \
            | grep -E '^\S' \
            | sort -u \
            > /tmp/scan/packages.txt
          echo "Transitive closure: $(wc -l < /tmp/scan/packages.txt)"

      - name: Resolve apt versions and SHA256s from snapshot
        run: |
          set -euo pipefail
          apt-cache dumpavail > /tmp/scan/all-packages.idx
          if [ ! -s /tmp/scan/all-packages.idx ]; then
            echo "ERROR: apt-cache dumpavail produced no output"
            exit 1
          fi

          : > /tmp/scan/apt-pins.txt
          while read -r pkg; do
            [ -z "${pkg}" ] && continue
            ver=$(dpkg-query -W -f='${Version}' "${pkg}" 2>/dev/null || true)
            if [ -z "${ver}" ]; then
              echo "skip: ${pkg} not installed (false positive from dpkg -S?)"
              continue
            fi
            read -r sha filename <<<"$(
              awk -v p="${pkg}" -v v="${ver}" '
                BEGIN { RS=""; FS="\n" }
                {
                  name=""; version=""; sha=""; file=""
                  for (i=1;i<=NF;i++) {
                    line=$i
                    if      (substr(line,1,9)=="Package: ")  name=substr(line,10)
                    else if (substr(line,1,9)=="Version: ")  version=substr(line,10)
                    else if (substr(line,1,8)=="SHA256: ")   sha=substr(line,9)
                    else if (substr(line,1,10)=="Filename: ") file=substr(line,11)
                  }
                  if (name==p && version==v && sha!="") {
                    print sha, file
                    exit
                  }
                }' /tmp/scan/all-packages.idx
            )"
            if [ -z "${sha}" ] || [ -z "${filename}" ]; then
              echo "WARN: no SHA256/Filename for ${pkg}=${ver} in snapshot index; skipping"
              continue
            fi
            printf '%s\t%s\t%s\t%s\n' "${pkg}" "${ver}" "${sha}" "${filename}" >> /tmp/scan/apt-pins.txt
          done < /tmp/scan/packages.txt
          echo "Resolved apt pins: $(wc -l < /tmp/scan/apt-pins.txt)"

      - name: Walk Maven local repo and emit Central pins
        # Every artifact mvn pulled is on disk under ${M2_REPO}.
        # Path layout matches Central's URL layout: groupId
        # segments (dots → slashes) / artifactId / version / file.
        # That makes URL reconstruction mechanical.
        #
        # Capture every file under ${M2_REPO} EXCEPT known
        # locally-generated metadata + recomputable checksum
        # sidecars. The previous restrictive allowlist
        # (.jar/.pom/.module only) missed real artifact types like
        # .zip / .tar.gz / .war / .aar / native libraries — surfaced
        # when maven-executor's dependency:unpack failed offline
        # against apache-maven-3.9.14-bin.zip that scan never
        # captured. Pinning everything is safer than allowlisting
        # types we know about today.
        #
        # Excludes:
        #   *.sha1, *.md5, *.sha256, *.sha512  — checksum sidecars
        #                                        published next to
        #                                        artifacts; mvn -o
        #                                        recomputes them
        #                                        from the artifact
        #                                        bytes.
        #   _remote.repositories               — locally-generated
        #                                        repo tracking; mvn
        #                                        -o doesn't need it.
        #   *.lastUpdated                      — repository check
        #                                        timestamp; not in
        #                                        Central layout.
        #   resolver-status.properties         — same.
        run: |
          set -euo pipefail
          export M2_REPO="${GITHUB_WORKSPACE}/.m2-scan"
          : > /tmp/scan/maven-pins.txt

          # Refuse to pin -SNAPSHOT artifacts — they're mutable by
          # convention. A project that depends on -SNAPSHOTs is
          # outside the reproducibility contract.
          if find "${M2_REPO}" -type d -name '*-SNAPSHOT' | grep -q .; then
            echo "ERROR: build resolved -SNAPSHOT dependencies; reproducibility cannot hold." >&2
            find "${M2_REPO}" -type d -name '*-SNAPSHOT' >&2
            exit 1
          fi

          while IFS= read -r f; do
            # Strip the m2 prefix to get the relative path,
            # which equals Central's URL path under maven2/.
            rel="${f#${M2_REPO}/}"
            sha=$(sha256sum "${f}" | awk '{print $1}')
            printf '%s\t%s\n' "${sha}" "${rel}" >> /tmp/scan/maven-pins.txt
          done < <(find "${M2_REPO}" -type f \
              ! -name '*.sha1' \
              ! -name '*.md5' \
              ! -name '*.sha256' \
              ! -name '*.sha512' \
              ! -name '_remote.repositories' \
              ! -name '*.lastUpdated' \
              ! -name 'resolver-status.properties' \
              | sort)

          echo "Maven pins: $(wc -l < /tmp/scan/maven-pins.txt)"
          if [ ! -s /tmp/scan/maven-pins.txt ]; then
            echo "ERROR: no Maven artifacts captured. Did the build skip dependency resolution?" >&2
            exit 1
          fi
          head -5 /tmp/scan/maven-pins.txt

      - name: Emit Dockerfile
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"

          {
            # Apache 2.0 header at the top so projects that run a
            # license-header checker (apache-rat-plugin and similar)
            # don't fail their next CI run on this file. The header
            # is generic Apache 2.0 — it does NOT claim ASF
            # ownership, so it's appropriate for adopters whether
            # or not they're an Apache project. RAT's default
            # ApacheV2 family matcher accepts the "Licensed under
            # the Apache License, Version 2.0" phrasing alone.
            echo "# Licensed under the Apache License, Version 2.0 (the \"License\");"
            echo "# you may not use this file except in compliance with the License."
            echo "# You may obtain a copy of the License at"
            echo "#"
            echo "#     http://www.apache.org/licenses/LICENSE-2.0"
            echo "#"
            echo "# Unless required by applicable law or agreed to in writing, software"
            echo "# distributed under the License is distributed on an \"AS IS\" BASIS,"
            echo "# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied."
            echo "# See the License for the specific language governing permissions and"
            echo "# limitations under the License."
            echo "#"
            echo "# Generated by slsa-maven scan.yml"
            echo "# {{GENERATOR_URL}} @ {{GENERATOR_SHA}}"
            echo "#"
            echo "# Every byte that ends up in this image is pinned end-to-end:"
            echo "# - apt packages by version + .deb SHA256"
            echo "# - Maven artifacts by SHA256 against repo1.maven.org/maven2/"
            echo "#"
            echo "# Apt mirror:         ${APT_MIRROR_URL}"
            echo "# Snapshot timestamp: ${SNAPSHOT_TS}"
            echo "# Maven:              ${MVN_VERSION} (from archive.apache.org)"
            echo "# JDK:                ${JDK_PACKAGE}"
            echo "# Ubuntu release:     ${RELEASE}"
            echo "#"
            echo "# This file is regenerated by scan.yml; hand edits do not"
            echo "# survive a fresh scan run."
            echo ""
            echo "FROM ubuntu@${IMAGE_DIGEST}"
            echo ""
            echo "ENV DEBIAN_FRONTEND=noninteractive"
            # JAVA_HOME baked in so maven-javadoc-plugin can shell
            # out to javadoc at release time — apt's openjdk-N-jdk
            # lays out at /usr/lib/jvm/java-N-openjdk-amd64 but
            # doesn't export JAVA_HOME system-wide.
            echo "ENV JAVA_HOME=${JAVA_HOME}"
            # UTF-8 locale baked in. Bare ubuntu images default to
            # LANG=C; the JVM picks US-ASCII as its default charset
            # under that, breaking any test that touches non-ASCII
            # filenames or string contents.
            echo "ENV LANG=C.UTF-8"
            echo "ENV LC_ALL=C.UTF-8"
            echo ""
            echo "# Step 1: bootstrap ca-certificates so we can reach"
            echo "# the apt mirror over HTTPS."
            echo "RUN apt-get update -qq \\"
            echo " && apt-get install -y --no-install-recommends ca-certificates"
            echo ""
            echo "# Step 2: redirect apt to the pinned snapshot."
            echo "RUN set -eu \\"
            echo " && printf '%s\\n' \\"
            echo "    'deb ${APT_MIRROR_URL} ${RELEASE} main restricted universe multiverse' \\"
            echo "    'deb ${APT_MIRROR_URL} ${RELEASE}-updates main restricted universe multiverse' \\"
            echo "    'deb ${APT_MIRROR_URL} ${RELEASE}-security main restricted universe multiverse' \\"
            echo "    > /etc/apt/sources.list \\"
            echo " && rm -f /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list \\"
            echo " && apt-get update -qq"
            echo ""
            echo "# Step 3: download each pinned .deb, verify its SHA256,"
            echo "# install. Single RUN so failure aborts the layer atomically."
            echo "RUN set -eux \\"
            echo " && mkdir -p /tmp/debs && cd /tmp/debs \\"
            # Acquire::Retries=10 + Acquire::http::Timeout=60 give
            # apt's per-fetch retry enough room to ride out
            # snapshot.ubuntu.com's 503 clusters (the GHA runner IP
            # pool gets rate-limited during peak hours). Without
            # these, the build-container apt-get download just
            # gives up on the first 503 wave and the image build
            # has to be re-triggered manually.
            echo " && apt-get -o Acquire::Retries=10 -o Acquire::http::Timeout=60 download \\"

            sort -k1,1 /tmp/scan/apt-pins.txt \
              | awk -F'\t' '{ printf "      %s=%s \\\n", $1, $2 }'

            echo " && printf '%s\\n' \\"

            awk -F'\t' '
              {
                pkg = $1; ver = $2; sha = $3; filename = $4
                n = split(filename, parts, "/")
                pool_deb = parts[n]
                m = split(pool_deb, fields, "_")
                arch = fields[m]
                sub(/\.deb$/, "", arch)
                gsub(/:/, "%3a", ver)
                apt_name = pkg "_" ver "_" arch ".deb"
                printf "      %c%s  %s%c \\\n", 39, sha, apt_name, 39
              }' /tmp/scan/apt-pins.txt | sort -k3,3

            echo "    > SHA256SUMS \\"
            echo " && sha256sum -c SHA256SUMS \\"
            echo " && apt-get install -y --no-install-recommends ./*.deb \\"
            echo " && cd / && rm -rf /tmp/debs \\"
            echo " && apt-get clean \\"
            echo " && rm -rf /var/lib/apt/lists/*"
            echo ""
            echo "# Step 4: install Maven from archive.apache.org. apt's"
            echo "# Maven (3.8.7 on noble LTS) fails most projects'"
            echo "# requireMavenVersion enforcer rule. Apache's archive is"
            echo "# content-addressable + immutable, so the SHA512 pin is"
            echo "# durable indefinitely."
            echo "RUN set -eux \\"
            echo " && curl -fsSL 'https://archive.apache.org/dist/maven/maven-3/${MVN_VERSION}/binaries/apache-maven-${MVN_VERSION}-bin.tar.gz' -o /tmp/maven.tgz \\"
            echo " && echo '${MVN_SHA512}  /tmp/maven.tgz' | sha512sum -c - \\"
            echo " && mkdir -p /opt/maven \\"
            echo " && tar -xzf /tmp/maven.tgz -C /opt/maven --strip-components=1 \\"
            echo " && ln -sf /opt/maven/bin/mvn /usr/local/bin/mvn \\"
            echo " && rm -f /tmp/maven.tgz"
            echo ""
            echo "# Step 5: pre-populate the Maven local repository."
            echo "# Each artifact is downloaded from repo1.maven.org and"
            echo "# SHA256-verified before landing in /root/.m2/repository."
            echo "# Maven Central is content-addressable + immutable by"
            echo "# convention, so a (groupId, artifactId, version) tuple"
            echo "# resolves to one specific file forever; the SHA256"
            echo "# stamps that immutability into this Dockerfile."
            echo "#"
            echo "# Chunked into batches so each RUN stays under Linux's"
            echo "# MAX_ARG_STRLEN (~128 KB) AND so the layer count stays"
            echo "# under Docker's 127-layer cap. Batches of 250 hold us"
            echo "# at ~100 KB per RUN; for keycloak-class projects with"
            echo "# ~5000+ resolved artifacts that's ~20 layers, well"
            echo "# under the Docker limit. Smaller batches (e.g. 100)"
            echo "# blew the layer cap on Keycloak; 250 is the chosen"
            echo "# middle ground — still under MAX_ARG_STRLEN with"
            echo "# margin."
            echo "RUN mkdir -p /root/.m2/repository"

            # Emit one RUN per CHUNK_SIZE artifacts. Bumped from 100
            # to 250 to keep the layer count under Docker's 127
            # cap for projects with thousands of dependencies
            # (Keycloak resolves ~5000+; at 100/RUN = ~50 layers
            # plus other layers exceeded the cap on early test
            # runs). 250-entry batches stay well under MAX_ARG_STRLEN
            # — each line is ~400 chars, 250 × 400 = 100 KB, vs
            # the ~128 KB exec arg limit.
            CHUNK_SIZE=250
            TOTAL=$(wc -l < /tmp/scan/maven-pins.txt)
            CHUNK_NUM=0
            COUNT=0
            while IFS=$'\t' read -r sha rel; do
              if [ $((COUNT % CHUNK_SIZE)) -eq 0 ]; then
                # Close the previous batch (if any) with a no-op
                # so the trailing && doesn't dangle.
                [ ${CHUNK_NUM} -gt 0 ] && echo " && true" && echo ""
                CHUNK_NUM=$((CHUNK_NUM + 1))
                LAST_IN_BATCH=$((COUNT + CHUNK_SIZE))
                [ ${LAST_IN_BATCH} -gt ${TOTAL} ] && LAST_IN_BATCH=${TOTAL}
                echo "# Maven pin batch ${CHUNK_NUM} (entries $((COUNT + 1))-${LAST_IN_BATCH} of ${TOTAL})"
                echo "RUN set -eux \\"
              fi
              # Target dir is the parent of the artifact's path
              # under /root/.m2/repository; mkdir -p is idempotent
              # and harmless if the same artifactId has multiple
              # files (jar + pom + module).
              dir=$(dirname "${rel}")
              echo " && mkdir -p '/root/.m2/repository/${dir}' \\"
              echo " && curl -fsSL 'https://repo1.maven.org/maven2/${rel}' -o '/root/.m2/repository/${rel}' \\"
              echo " && echo '${sha}  /root/.m2/repository/${rel}' | sha256sum -c - \\"
              COUNT=$((COUNT + 1))
            done < /tmp/scan/maven-pins.txt

            # Trailing no-op so the last && in the final batch
            # doesn't dangle.
            echo " && true"
            echo ""
            echo "# Re-register any workspace as a safe git directory for"
            echo "# the container user."
            echo "RUN git config --global --add safe.directory '*'"
          } > Dockerfile.new

          echo "Dockerfile draft size: $(wc -l < Dockerfile.new) lines"
          head -50 Dockerfile.new

      - name: Commit Dockerfile if changed
        id: commit
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          if [ -f Dockerfile ] && cmp -s Dockerfile Dockerfile.new; then
            echo "Dockerfile is unchanged — nothing to commit."
            rm -f Dockerfile.new
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mv Dockerfile.new Dockerfile

          # Dry-run path: leave Dockerfile in place for inspection
          # but skip every git operation. Used by local act runs
          # against an internal Artifactory cache where the override
          # URL must not reach the remote.
          if [ "${DRY_RUN}" = "true" ]; then
            echo "DRY_RUN=true — Dockerfile written to disk; skipping commit and push."
            echo "Inspect ${GITHUB_WORKSPACE}/Dockerfile to review the scan output."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Dockerfile

          if git diff --cached --quiet; then
            echo "No diff after staging — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # No [skip ci] marker. GitHub's skip-ci semantics
          # suppress workflows on BOTH push AND pull_request
          # events for the marked commit — using it on the auto-
          # commit silences the Dockerfile-regen push (good)
          # but also silences pull_request checks against this
          # commit as a head (bad: adopters lose the project's
          # own CI signal on the slsa-maven PR). The trade-off
          # came out the wrong way; better to let upstream
          # workflows re-run on each regen than to mask the
          # project's PR-time test signal.
          git commit \
            -m 'Regenerate Dockerfile via slsa-maven scan' \
            -m "Apt mirror: ${APT_MIRROR_URL}" \
            -m "Snapshot timestamp: ${SNAPSHOT_TS}" \
            -m 'Every apt and Maven byte verified by SHA256.'

          # Race-tolerant push: another commit may have landed on
          # the target branch while we were tracing. Refresh the
          # remote ref, rebase, retry up to three times.
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git merge-base --is-ancestor "origin/${GITHUB_REF_NAME}" HEAD; then
              echo "Remote ${GITHUB_REF_NAME} advanced (attempt ${attempt}); rebasing."
              git rebase "origin/${GITHUB_REF_NAME}" \
                || { echo "Rebase conflict — another commit touched Dockerfile. Aborting."; exit 1; }
            fi
            if git push origin "HEAD:${GITHUB_REF}"; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "Push still rejected after 3 attempts; aborting."
              exit 1
            fi
            echo "Push rejected (attempt ${attempt}); retrying."
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch build-container workflow
        # Explicit dispatch because GITHUB_TOKEN-authored commits
        # don't fire push-triggered workflows. Non-fatal on first
        # adoption (build-container.yml may not yet be on the
        # default branch — workflow_dispatch needs that).
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          http=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-container.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}")
          case "${http}" in
            204)
              echo "Dispatched build-container.yml on ${GITHUB_REF_NAME}"
              ;;
            404)
              echo "Dispatch 404 — build-container.yml is likely not yet on the default branch."
              echo "First-time adoption: the PR merge will fire build-container via push trigger. Continuing."
              ;;
            *)
              echo "Unexpected HTTP ${http} from dispatch:"
              cat /tmp/dispatch.out || true
              exit 1
              ;;
          esac
