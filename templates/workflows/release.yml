# Generated by slsa-maven
# {{GENERATOR_URL}} @ {{GENERATOR_SHA}}
#
# Reproducible release workflow for a Maven project.
#
# Triggered by pushing a tag. Produces the four standard Maven
# release artifacts:
#   - <artifactId>-<version>.jar
#   - <artifactId>-<version>-sources.jar
#   - <artifactId>-<version>-javadoc.jar
#   - <artifactId>-<version>.pom
#
# Each artifact is built TWICE in independent containers — one
# pair per file — and the two passes are byte-compared. Each
# verified artifact is then signed two ways (SLSA build
# provenance + cosign detached bundle). Published as a DRAFT
# release; the maintainer may add a GPG signature locally before
# flipping to published.
#
# Job graph:
#
#   test
#     ├─ build (jar,     pass=1) ─┐
#     ├─ build (jar,     pass=2) ─┤  → verify (jar)     ─┐
#     ├─ build (sources, pass=1) ─┤                      │
#     ├─ build (sources, pass=2) ─┤  → verify (sources) ─┤
#     ├─ build (javadoc, pass=1) ─┤                      ├─ publish
#     ├─ build (javadoc, pass=2) ─┤  → verify (javadoc) ─┤
#     ├─ build (pom,     pass=1) ─┤                      │
#     └─ build (pom,     pass=2) ─┘  → verify (pom)     ─┘
#
# 1 + 8 + 4 + 1 = 14 jobs. The 8 build jobs and 4 verify jobs are
# each one matrix-spec, not 12 copy-pasted definitions.
#
# Why one pair per file? Per-artifact isolation. A flaky javadoc
# generation can't taint the jar bit-compare. Each artifact gets
# its own SLSA attestation + cosign signature scoped to bytes,
# not a "release-bundle" attestation that hides which artifact
# actually drifted. The pom pair is included for symmetry — the
# pom "build" is just a file copy from the source tree, so the
# bytes are guaranteed-identical, but the pair is still present
# as audit evidence that nothing edited the pom between passes.
#
# Reproducibility envelope:
#   - SOURCE_DATE_EPOCH from `git log -1 --format=%ct <tag>`,
#     exported to $GITHUB_ENV in every job so any process-
#     inherited shell-out (gzip / tar / jar tool) honors it.
#   - -Dproject.build.outputTimestamp=<ISO-8601(SDE)> overrides
#     whatever the pom committed; stale pom timestamps can't drift
#     between pass1 and pass2.
#   - -Dnotimestamp=true on the javadoc plugin, suppressing the
#     dc.created HTML <meta>.
#   - mvn -o (offline) — the builder image carries the entire
#     local repo; nothing reaches the network mid-build.
#
# Verifying a published release:
#
#   gh attestation verify <artifact> \
#       --repo <owner>/<repo> \
#       --signer-workflow <owner>/<repo>/.github/workflows/release.yml
#
#   cosign verify-blob \
#       --bundle <artifact>.sigstore --new-bundle-format \
#       --certificate-identity \
#         'https://github.com/<owner>/<repo>/.github/workflows/release.yml@refs/tags/<tag>' \
#       --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
#       <artifact>
#
#   gpg --verify <artifact>.asc <artifact>     # if maintainer GPG-signed

name: Release

on:
  push:
    # Permissive tag matcher — projects use whatever scheme their
    # upstream already uses. Apache Commons style is
    # `rel/commons-lang-3.18.0`; semver-style is `v1.2.3` or
    # `1.2.3`. Version derivation below tolerates all three.
    tags:
      - 'v*'
      - '[0-9]*'
      - 'rel/*'

permissions: {}

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/{{LOWERCASE_REPO}}/builder@sha256:{{BUILDER_DIGEST}}
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Mark workspace safe for git (pre-checkout)
        shell: sh
        run: git config --global --add safe.directory '*'

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Derive SOURCE_DATE_EPOCH
        # SDE drives every reproducibility knob downstream. Source
        # it from the TAG commit, not the workflow run, so a
        # release built today and a release rebuilt next year
        # produce the same bytes. Export to $GITHUB_ENV so any
        # process Maven shells out to (jar tool, gzip, tar) sees
        # the env var natively.
        id: meta
        run: |
          set -eu
          SDE=$(git log -1 --format=%ct "${GITHUB_REF_NAME}")
          echo "sde=${SDE}" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=${SDE}" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH = ${SDE} ($(date -u -d @${SDE} '+%Y-%m-%dT%H:%M:%SZ'))"

      - name: Run tests offline
        # mvn -o forces offline mode. The builder image carries the
        # full pre-resolved local repo at /root/.m2/repository, so
        # offline succeeds without network. -B = batch mode, no
        # ANSI / progress spinner.
        # `verify` is the broadest pre-release gate: compile +
        # test (Surefire) + package + integration-test (Failsafe)
        # + verify-phase plugins (RAT, Enforcer rules).
        run: |
          set -euo pipefail
          mvn -o -B verify

  # One pair (pass=1 + pass=2) per release artifact, eight build
  # jobs total. Each matrix entry runs ONE focused mvn goal that
  # produces ONE artifact, then uploads that one file. This keeps
  # per-artifact isolation: a non-deterministic javadoc render
  # only fails the javadoc pair's bit-compare, not the jar's.
  #
  # Both passes of a given artifact share `${GITHUB_WORKSPACE}` as
  # their absolute pwd inside their respective containers — same
  # path in both, so anything that bakes the build path into output
  # bakes the SAME path in both passes by construction.
  #
  # fail-fast: false lets all eight build jobs run to completion
  # even if one pair fails early; the verify jobs that depend on
  # each pair report their own bit-compare result independently.
  build:
    name: Build ${{ matrix.artifact }} (pass ${{ matrix.pass }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        artifact: [jar, sources, javadoc, pom]
        pass: [1, 2]
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/{{LOWERCASE_REPO}}/builder@sha256:{{BUILDER_DIGEST}}
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Mark workspace safe for git (pre-checkout)
        shell: sh
        run: git config --global --add safe.directory '*'

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Need history so we can read the tag commit's timestamp.
          fetch-depth: 0
          persist-credentials: false

      - name: Derive version and SOURCE_DATE_EPOCH
        id: meta
        run: |
          set -eu
          SDE=$(git log -1 --format=%ct "${GITHUB_REF_NAME}")
          ISO_TS=$(date -u -d "@${SDE}" '+%Y-%m-%dT%H:%M:%SZ')
          {
            echo "sde=${SDE}"
            echo "iso_ts=${ISO_TS}"
          } >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=${SDE}" >> "$GITHUB_ENV"

      - name: Read project coordinates from pom
        id: coords
        # Authoritative artifactId / version come from `mvn
        # help:evaluate`, which resolves inherited values from the
        # parent pom hierarchy. Used by every matrix entry to
        # compute its target artifact filename.
        run: |
          set -eu
          ARTIFACT_ID=$(mvn -o -B -q -DforceStdout help:evaluate -Dexpression=project.artifactId)
          VERSION=$(mvn -o -B -q -DforceStdout help:evaluate -Dexpression=project.version)
          {
            echo "artifact_id=${ARTIFACT_ID}"
            echo "version=${VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.artifact }}
        # Per-artifact mvn goal:
        #   jar     — `mvn -o package -DskipTests` runs validate →
        #             ... → compile → test-compile → package
        #             (Surefire skipped: tests already ran in the
        #             test job; running them again per-pair would
        #             quadruple wall time).
        #   sources — `mvn -o source:jar` is a standalone goal
        #             (the source plugin's `jar` mojo doesn't
        #             require any preceding phase). Just zips the
        #             configured source roots.
        #   javadoc — `mvn -o javadoc:jar` requires compile (the
        #             javadoc tool needs class context to resolve
        #             cross-references), so it triggers
        #             validate → ... → compile → javadoc:jar.
        #             -Dnotimestamp=true suppresses the
        #             dc.created HTML <meta> stamp.
        #   pom     — pure file copy. The pom released to Central
        #             is the project's pom.xml renamed to the
        #             standard convention. No mvn invocation; the
        #             two passes producing identical bytes is a
        #             tautology, but the pair is here for the same
        #             audit evidence the others provide.
        env:
          ARTIFACT_TYPE: ${{ matrix.artifact }}
          ARTIFACT_ID: ${{ steps.coords.outputs.artifact_id }}
          VERSION: ${{ steps.coords.outputs.version }}
          ISO_TS: ${{ steps.meta.outputs.iso_ts }}
        run: |
          set -euo pipefail
          mkdir -p dist
          case "${ARTIFACT_TYPE}" in
            jar)
              mvn -o -B \
                  -Dproject.build.outputTimestamp="${ISO_TS}" \
                  -DskipTests \
                  package
              cp "target/${ARTIFACT_ID}-${VERSION}.jar" "dist/"
              ;;
            sources)
              mvn -o -B \
                  -Dproject.build.outputTimestamp="${ISO_TS}" \
                  source:jar
              cp "target/${ARTIFACT_ID}-${VERSION}-sources.jar" "dist/"
              ;;
            javadoc)
              mvn -o -B \
                  -Dproject.build.outputTimestamp="${ISO_TS}" \
                  -Dnotimestamp=true \
                  javadoc:jar
              cp "target/${ARTIFACT_ID}-${VERSION}-javadoc.jar" "dist/"
              ;;
            pom)
              cp pom.xml "dist/${ARTIFACT_ID}-${VERSION}.pom"
              ;;
            *)
              echo "ERROR: unknown matrix.artifact value: ${ARTIFACT_TYPE}" >&2
              exit 1
              ;;
          esac
          echo "Built ${ARTIFACT_TYPE} for pass ${{ matrix.pass }}:"
          ls -la dist/

      - name: Upload artifact
        # One-file upload, named by both artifact and pass so the
        # corresponding verify matrix entry can pull its specific
        # pair without ambiguity.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.artifact }}-pass${{ matrix.pass }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # Per-artifact verify: download the artifact's two passes, byte-
  # compare, attest provenance, sign with cosign. Four jobs, one
  # per file. needs: build waits for ALL eight build matrix entries
  # to complete before any verify entry starts.
  verify:
    name: Verify ${{ matrix.artifact }} (bit-compare + sign)
    needs: build
    strategy:
      fail-fast: false
      matrix:
        artifact: [jar, sources, javadoc, pom]
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/{{LOWERCASE_REPO}}/builder@sha256:{{BUILDER_DIGEST}}
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    permissions:
      contents: read
      # Publish the SLSA attestation (out-of-band from artifacts).
      attestations: write
      # Mint the short-lived OIDC token for keyless sigstore signing.
      id-token: write

    steps:
      - name: Download pass 1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-${{ matrix.artifact }}-pass1
          path: pass1

      - name: Download pass 2
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-${{ matrix.artifact }}-pass2
          path: pass2

      - name: Bit-compare passes
        # File-set check first — a missing or extra file in either
        # pass would otherwise slip past a per-file diff that
        # iterates over only one side.
        run: |
          set -eu
          (cd pass1 && ls -1 | LC_ALL=C sort) > pass1.list
          (cd pass2 && ls -1 | LC_ALL=C sort) > pass2.list
          if ! diff -u pass1.list pass2.list; then
            echo "FAIL: pass1 and pass2 emitted different file sets for ${{ matrix.artifact }}"
            exit 1
          fi
          echo "=== sha256 ==="
          sha256sum pass1/* pass2/*
          echo
          for f in pass1/*; do
            base=$(basename "$f")
            diff -q "pass1/${base}" "pass2/${base}"
          done
          echo "Bit-compare passed for ${{ matrix.artifact }}."

      - name: Diagnose differences
        # Only fires on bit-compare failure. Helps an operator see
        # whether the divergence is in the manifest, in the class
        # files, in javadoc HTML, or in ZIP entry order — each of
        # those points at a different reproducibility knob.
        if: ${{ failure() }}
        env:
          ARTIFACT_TYPE: ${{ matrix.artifact }}
        run: |
          set -u
          mkdir -p diag
          case "${ARTIFACT_TYPE}" in
            jar|sources|javadoc)
              # ZIP-format artifacts: dump entry listing + manifest.
              for f in pass1/*; do
                base=$(basename "$f")
                stem="${base%.jar}"
                echo "=== ${stem}: cmp first differing byte ==="
                cmp "pass1/${base}" "pass2/${base}" || true
                echo "=== ${stem}: zip listing diff ==="
                unzip -lqq "pass1/${base}" | LC_ALL=C sort > "diag/${stem}.p1.list" || true
                unzip -lqq "pass2/${base}" | LC_ALL=C sort > "diag/${stem}.p2.list" || true
                diff -u "diag/${stem}.p1.list" "diag/${stem}.p2.list" | head -60 || true
                echo "=== ${stem}: MANIFEST.MF diff ==="
                unzip -p "pass1/${base}" META-INF/MANIFEST.MF > "diag/${stem}.p1.mf" 2>/dev/null || true
                unzip -p "pass2/${base}" META-INF/MANIFEST.MF > "diag/${stem}.p2.mf" 2>/dev/null || true
                diff -u "diag/${stem}.p1.mf" "diag/${stem}.p2.mf" || true
              done
              ;;
            pom)
              # Plain XML — straight diff is enough.
              for f in pass1/*; do
                base=$(basename "$f")
                echo "=== ${base}: diff ==="
                diff -u "pass1/${base}" "pass2/${base}" | head -60 || true
              done
              ;;
          esac

      - name: Stage release artifact
        # Sign pass1's bytes — identical to pass2 by the bit-
        # compare above, so the choice is arbitrary.
        run: |
          set -eu
          mkdir -p release
          cp pass1/* release/
          ls -la release/

      - name: SLSA build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: release/*

      - name: Install cosign
        # The builder image's apt set is derived from the Maven
        # build trace, which never invokes cosign. Install it from
        # the GitHub releases endpoint with SHA256 verification.
        # Same version as build-container.yml so the signing tool
        # is pinned consistently across the pipeline.
        run: |
          set -euo pipefail
          COSIGN_VERSION=v3.0.6
          COSIGN_SHA256=c956e5dfcac53d52bcf058360d579472f0c1d2d9b69f55209e256fe7783f4c74
          curl -fsSL \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" \
            -o /usr/local/bin/cosign
          echo "${COSIGN_SHA256}  /usr/local/bin/cosign" | sha256sum -c -
          chmod +x /usr/local/bin/cosign

      - name: Sign artifact with cosign
        env:
          COSIGN_YES: 'true'
        run: |
          set -euo pipefail
          for f in release/*; do
            [ -f "${f}" ] || continue
            case "${f}" in *.sigstore) continue ;; esac
            cosign sign-blob --bundle "${f}.sigstore" --new-bundle-format "${f}"
          done
          ls -la release/

      - name: Upload verified artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-${{ matrix.artifact }}
          path: release/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Create draft release
    needs: verify
    # `needs.verify.result` aggregates over all matrix entries:
    # 'success' iff every entry succeeded. Any verify-side failure
    # (bit-compare, signing, attestation) blocks publish.
    if: needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Only job with write access — actually creates the release.
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Derive SOURCE_DATE_EPOCH for release notes
        id: meta
        run: |
          set -eu
          SDE=$(git log -1 --format=%ct "${GITHUB_REF_NAME}")
          ISO_TS=$(date -u -d "@${SDE}" '+%Y-%m-%dT%H:%M:%SZ')
          {
            echo "sde=${SDE}"
            echo "iso_ts=${ISO_TS}"
          } >> "$GITHUB_OUTPUT"

      - name: Download all verified artifacts
        # pattern: 'verified-*' pulls every per-artifact bundle
        # the verify matrix uploaded; merge-multiple flattens them
        # into release/ so all four files (plus their .sigstore
        # bundles) live side-by-side for the release upload.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: verified-*
          path: release
          merge-multiple: true

      - name: Determine release name
        id: name
        # Strip common tag prefixes for the GitHub release UI.
        # `rel/commons-lang-3.18.0` → `commons-lang-3.18.0`,
        # `v1.2.3` → `1.2.3`. Artifact filenames are unaffected.
        run: |
          set -eu
          NAME="${GITHUB_REF_NAME#rel/}"
          NAME="${NAME#v}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Regenerate SHA256SUMS
        # Now that all four artifacts are in release/, write a
        # combined SHA256SUMS covering everything except sigstore
        # bundles and the SHA256SUMS file itself.
        run: |
          set -euo pipefail
          cd release
          rm -f SHA256SUMS
          ls -1 \
            | grep -v '\.sigstore$' \
            | grep -v '^SHA256SUMS$' \
            | LC_ALL=C sort \
            | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Build release notes
        env:
          NAME: ${{ steps.name.outputs.name }}
          SDE: ${{ steps.meta.outputs.sde }}
          ISO_TS: ${{ steps.meta.outputs.iso_ts }}
          # workflow_ref embeds the tag name, which a compromised
          # maintainer could shape to inject shell. Pipe through
          # env so the shell sees a bare variable, not a template
          # expansion.
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -eu
          main_artifacts() {
            ls -1 release \
              | grep -v '\.sigstore$' \
              | grep -v '^SHA256SUMS$' \
              | LC_ALL=C sort
          }
          {
            echo "## Release ${NAME}"
            echo
            echo "Produced by an automated GitHub Actions workflow from the"
            echo "tagged commit. Each artifact was built twice in independent"
            echo "containers and byte-compared; every artifact ships with a"
            echo "SLSA build provenance attestation and a cosign detached"
            echo "signature."
            echo
            echo "**This release is currently a DRAFT.** The maintainer may"
            echo "optionally sign each artifact with their GPG key and"
            echo "attach the resulting \`.asc\` files before publishing."
            echo
            echo "### Build provenance"
            echo
            echo "- **Commit:**              \`${GITHUB_SHA}\`"
            echo "- **Tag:**                 \`${GITHUB_REF_NAME}\`"
            echo "- **SOURCE_DATE_EPOCH:**   \`${SDE}\` (\`${ISO_TS}\`)"
            echo "- **Builder image:**       \`ghcr.io/{{LOWERCASE_REPO}}/builder@sha256:{{BUILDER_DIGEST}}\`"
            echo "- **Workflow:**            \`${WORKFLOW_REF}\`"
            echo
            echo "### Checksums"
            echo
            echo '```'
            cat release/SHA256SUMS
            echo '```'
            echo
            echo "### Verifying"
            echo
            echo "**SLSA provenance (needs the \`gh\` CLI):**"
            echo '```'
            while read -r base; do
              echo "gh attestation verify ${base} \\"
              echo "    --repo ${{ github.repository }} \\"
              echo "    --signer-workflow ${{ github.repository }}/.github/workflows/release.yml"
            done < <(main_artifacts)
            echo '```'
            echo
            echo "**cosign detached signature (works without \`gh\`):**"
            echo '```'
            while read -r base; do
              echo "cosign verify-blob \\"
              echo "    --bundle ${base}.sigstore --new-bundle-format \\"
              echo "    --certificate-identity \\"
              echo "      'https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}' \\"
              echo "    --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\"
              echo "    ${base}"
            done < <(main_artifacts)
            echo '```'
            echo
            echo "**GPG (after the maintainer publishes):**"
            echo '```'
            while read -r base; do
              echo "gpg --verify ${base}.asc ${base}"
            done < <(main_artifacts)
            echo '```'
          } > release_notes.md

      - name: Create DRAFT release
        env:
          NAME: ${{ steps.name.outputs.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          PRERELEASE=""
          case "${NAME}" in
            *alpha*|*beta*|*rc*|*demo*|*pre*|*-SNAPSHOT*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --title "${NAME}" \
            --notes-file release_notes.md \
            --draft \
            ${PRERELEASE} \
            release/*

      - name: Maintainer action needed
        run: |
          {
            echo "### Draft release created"
            echo
            echo "Optional next step: **sign artifacts with your GPG key and publish.**"
            echo
            echo '```'
            echo "# From a machine with your GPG private key:"
            echo "gh release download ${GITHUB_REF_NAME} -R ${{ github.repository }}"
            echo "for f in *; do"
            echo "  case \"\$f\" in *.sigstore|*.asc|SHA256SUMS) continue ;; esac"
            echo "  [ -f \"\$f\" ] && gpg --detach-sign --armor \"\$f\""
            echo "done"
            echo "gh release upload ${GITHUB_REF_NAME} *.asc -R ${{ github.repository }}"
            echo "gh release edit   ${GITHUB_REF_NAME} --draft=false -R ${{ github.repository }}"
            echo '```'
            echo
            echo "Original artifact bytes are untouched; existing SLSA and"
            echo "cosign signatures remain valid after publication."
          } >> "$GITHUB_STEP_SUMMARY"
