# Generated by slsa-maven
# {{GENERATOR_URL}} @ {{GENERATOR_SHA}}
#
# Reproducible release workflow for a Maven project.
#
# Triggered by pushing a tag. Produces the four (or five) standard
# Maven release artifacts:
#   - <artifactId>-<version>.jar
#   - <artifactId>-<version>-sources.jar
#   - <artifactId>-<version>-javadoc.jar
#   - <artifactId>-<version>.pom
#   - <artifactId>-<version>.module           (only if the project
#                                              publishes Gradle
#                                              module metadata)
#
# Each artifact is built twice in independent containers, byte-
# compared, then signed two ways (SLSA build provenance + cosign
# detached bundle). Published as a DRAFT release; the maintainer
# may add a GPG signature locally before flipping to published.
#
# Job graph:
#
#   test
#     ├─ build_pass1   ─┐
#     └─ build_pass2   ─┘  → verify  →  publish
#
# Reproducibility envelope:
#   - SOURCE_DATE_EPOCH from `git log -1 --format=%ct <tag>`,
#     exported to $GITHUB_ENV in every job so any process-
#     inherited shell-out (gzip / tar / jar tool) honors it.
#   - -Dproject.build.outputTimestamp=<ISO-8601(SDE)> overrides
#     whatever the pom committed; stale pom timestamps can't drift
#     between pass1 and pass2.
#   - -Dnotimestamp=true on the javadoc plugin, suppressing the
#     dc.created HTML <meta>.
#   - mvn -o (offline) — the builder image carries the entire
#     local repo; nothing reaches the network mid-build.
#
# Verifying a published release:
#
#   gh attestation verify <artifact> \
#       --repo <owner>/<repo> \
#       --signer-workflow <owner>/<repo>/.github/workflows/release.yml
#
#   cosign verify-blob \
#       --bundle <artifact>.sigstore --new-bundle-format \
#       --certificate-identity \
#         'https://github.com/<owner>/<repo>/.github/workflows/release.yml@refs/tags/<tag>' \
#       --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
#       <artifact>
#
#   gpg --verify <artifact>.asc <artifact>     # if maintainer GPG-signed

name: Release

on:
  push:
    # Permissive tag matcher — projects use whatever scheme their
    # upstream already uses. Apache Commons style is
    # `rel/commons-lang-3.18.0`; semver-style is `v1.2.3` or
    # `1.2.3`. Version derivation below tolerates all three.
    tags:
      - 'v*'
      - '[0-9]*'
      - 'rel/*'

permissions: {}

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/{{LOWERCASE_REPO}}/builder@sha256:{{BUILDER_DIGEST}}
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Mark workspace safe for git (pre-checkout)
        shell: sh
        run: git config --global --add safe.directory '*'

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Derive SOURCE_DATE_EPOCH
        # SDE drives every reproducibility knob downstream. Source
        # it from the TAG commit, not the workflow run, so a
        # release built today and a release rebuilt next year
        # produce the same bytes. Export to $GITHUB_ENV so any
        # process Maven shells out to (jar tool, gzip, tar) sees
        # the env var natively.
        id: meta
        run: |
          set -eu
          SDE=$(git log -1 --format=%ct "${GITHUB_REF_NAME}")
          echo "sde=${SDE}" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=${SDE}" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH = ${SDE} ($(date -u -d @${SDE} '+%Y-%m-%dT%H:%M:%SZ'))"

      - name: Run tests offline
        # mvn -o forces offline mode. The builder image carries the
        # full pre-resolved local repo at /root/.m2/repository, so
        # offline succeeds without network. -B = batch mode, no
        # ANSI / progress spinner.
        # `verify` is the broadest pre-release gate: compile +
        # test (Surefire) + package + integration-test (Failsafe)
        # + verify-phase plugins (RAT, Enforcer rules).
        run: |
          set -euo pipefail
          mvn -o -B verify

  # Two parallel build jobs in independent containers at the same
  # ${GITHUB_WORKSPACE}. Identical absolute pwd between passes
  # means anything that bakes the build path into output bakes the
  # SAME path in both passes by construction — the bit-compare in
  # `verify` then holds without per-target workarounds.
  build_pass1:
    name: Build artifacts (pass 1)
    needs: test
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/{{LOWERCASE_REPO}}/builder@sha256:{{BUILDER_DIGEST}}
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Mark workspace safe for git (pre-checkout)
        shell: sh
        run: git config --global --add safe.directory '*'

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Need history so we can read the tag commit's timestamp.
          fetch-depth: 0
          persist-credentials: false

      - name: Derive version and SOURCE_DATE_EPOCH
        id: meta
        # VERSION derivation: strip 'v' or 'rel/<artifact>-' prefix
        # so commons-lang's `rel/commons-lang-3.18.0` and a
        # semver-style `v3.18.0` both resolve to `3.18.0`. The
        # canonical version is what the pom's <version> field
        # holds; we read it via mvn help:evaluate after this step
        # rather than trusting the tag-derived form for artifact
        # filenames.
          # Same SOURCE_DATE_EPOCH derivation as the test job —
          # tag commit timestamp, not workflow run.
        run: |
          set -eu
          SDE=$(git log -1 --format=%ct "${GITHUB_REF_NAME}")
          ISO_TS=$(date -u -d "@${SDE}" '+%Y-%m-%dT%H:%M:%SZ')
          {
            echo "sde=${SDE}"
            echo "iso_ts=${ISO_TS}"
          } >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=${SDE}" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH = ${SDE} (${ISO_TS})"

      - name: Read project coordinates from pom
        id: coords
        # Authoritative artifactId / version come from `mvn
        # help:evaluate`, which resolves inherited values from the
        # parent pom hierarchy. xmllint on the project pom alone
        # would miss anything inherited.
        run: |
          set -eu
          ARTIFACT_ID=$(mvn -o -B -q -DforceStdout help:evaluate -Dexpression=project.artifactId)
          VERSION=$(mvn -o -B -q -DforceStdout help:evaluate -Dexpression=project.version)
          {
            echo "artifact_id=${ARTIFACT_ID}"
            echo "version=${VERSION}"
          } >> "$GITHUB_OUTPUT"
          echo "Artifact: ${ARTIFACT_ID}-${VERSION}"

      - name: Build artifacts (offline, reproducible)
        # -o:                offline — fails loudly if any byte
        #                    needs to come from the network.
        # -Dproject.build.outputTimestamp=<ISO>:
        #                    overrides whatever the pom committed.
        #                    Maven's archiver uses this for ZIP
        #                    entry mtimes; setting it from SDE
        #                    means a stale pom timestamp can't
        #                    drift between pass1 and pass2.
        # -Dnotimestamp=true: passed to maven-javadoc-plugin to
        #                    suppress the dc.created <meta> tag
        #                    in generated HTML.
        # -DskipTests:       tests already ran in the test job;
        #                    re-running here would just slow things
        #                    down. The user's call: "no point in
        #                    running unit tests twice."
        # -Dmaven.repo.local: pin to the image-prepopulated repo at
        #                    /root/.m2/repository (mvn's default
        #                    when running as root).
        run: |
          set -euo pipefail
          mvn -o -B \
              -Dproject.build.outputTimestamp="${{ steps.meta.outputs.iso_ts }}" \
              -Dnotimestamp=true \
              -DskipTests \
              package source:jar javadoc:jar

      - name: Stage release artifacts
        env:
          ARTIFACT_ID: ${{ steps.coords.outputs.artifact_id }}
          VERSION: ${{ steps.coords.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Copy the jar artifacts produced by `package` /
          # `source:jar` / `javadoc:jar`. All four (jar, sources,
          # javadoc, .module if present) live under target/.
          cp "target/${ARTIFACT_ID}-${VERSION}.jar"          "dist/"
          cp "target/${ARTIFACT_ID}-${VERSION}-sources.jar"  "dist/"
          cp "target/${ARTIFACT_ID}-${VERSION}-javadoc.jar"  "dist/"
          # The pom that gets released is the project's pom.xml,
          # renamed to the Maven Central convention. This is what
          # `mvn install` would copy into the local repo.
          cp pom.xml "dist/${ARTIFACT_ID}-${VERSION}.pom"
          # .module (Gradle module metadata) is optional. Only
          # projects using the gradle-module-metadata-maven-plugin
          # produce it; copy if present.
          if [ -f "target/${ARTIFACT_ID}-${VERSION}.module" ]; then
            cp "target/${ARTIFACT_ID}-${VERSION}.module" "dist/"
            echo "Captured Gradle Module Metadata."
          fi
          echo "Pass 1 artifacts:"
          ls -la dist/

      - name: Upload pass 1 artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-pass1
          path: dist/
          if-no-files-found: error
          retention-days: 1

  build_pass2:
    # Byte-identical mirror of build_pass1. The two jobs run in
    # parallel on independent runners with the same container
    # image; identical absolute pwd between passes is what makes
    # the bit-compare robust against absolute-path leakage.
    # If you change anything in the body, change it in build_pass1
    # too.
    name: Build artifacts (pass 2)
    needs: test
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/{{LOWERCASE_REPO}}/builder@sha256:{{BUILDER_DIGEST}}
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Mark workspace safe for git (pre-checkout)
        shell: sh
        run: git config --global --add safe.directory '*'

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Derive version and SOURCE_DATE_EPOCH
        id: meta
        run: |
          set -eu
          SDE=$(git log -1 --format=%ct "${GITHUB_REF_NAME}")
          ISO_TS=$(date -u -d "@${SDE}" '+%Y-%m-%dT%H:%M:%SZ')
          {
            echo "sde=${SDE}"
            echo "iso_ts=${ISO_TS}"
          } >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=${SDE}" >> "$GITHUB_ENV"

      - name: Read project coordinates from pom
        id: coords
        run: |
          set -eu
          ARTIFACT_ID=$(mvn -o -B -q -DforceStdout help:evaluate -Dexpression=project.artifactId)
          VERSION=$(mvn -o -B -q -DforceStdout help:evaluate -Dexpression=project.version)
          {
            echo "artifact_id=${ARTIFACT_ID}"
            echo "version=${VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Build artifacts (offline, reproducible)
        run: |
          set -euo pipefail
          mvn -o -B \
              -Dproject.build.outputTimestamp="${{ steps.meta.outputs.iso_ts }}" \
              -Dnotimestamp=true \
              -DskipTests \
              package source:jar javadoc:jar

      - name: Stage release artifacts
        env:
          ARTIFACT_ID: ${{ steps.coords.outputs.artifact_id }}
          VERSION: ${{ steps.coords.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${ARTIFACT_ID}-${VERSION}.jar"          "dist/"
          cp "target/${ARTIFACT_ID}-${VERSION}-sources.jar"  "dist/"
          cp "target/${ARTIFACT_ID}-${VERSION}-javadoc.jar"  "dist/"
          cp pom.xml "dist/${ARTIFACT_ID}-${VERSION}.pom"
          if [ -f "target/${ARTIFACT_ID}-${VERSION}.module" ]; then
            cp "target/${ARTIFACT_ID}-${VERSION}.module" "dist/"
          fi

      - name: Upload pass 2 artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-pass2
          path: dist/
          if-no-files-found: error
          retention-days: 1

  verify:
    name: Verify reproducibility, attest, sign
    needs: [build_pass1, build_pass2]
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/{{LOWERCASE_REPO}}/builder@sha256:{{BUILDER_DIGEST}}
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Download pass 1 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-pass1
          path: pass1

      - name: Download pass 2 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-pass2
          path: pass2

      - name: Verify reproducibility
        # File-set check first — the bit-compare loop iterates over
        # pass1, so an extra/missing file in pass2 would otherwise
        # slip past.
        run: |
          set -eu
          (cd pass1 && ls -1 | LC_ALL=C sort) > pass1.list
          (cd pass2 && ls -1 | LC_ALL=C sort) > pass2.list
          if ! diff -u pass1.list pass2.list; then
            echo "FAIL: pass1 and pass2 emitted different file sets"
            exit 1
          fi
          echo "=== sha256 ==="
          sha256sum pass1/* pass2/*
          echo
          for f in pass1/*; do
            base=$(basename "$f")
            diff -q "pass1/${base}" "pass2/${base}"
          done
          echo "Reproducibility verified: all artifacts byte-identical across passes."

      - name: Diagnose artifact differences
        # Only fires on bit-compare failure. Helps an operator see
        # whether the divergence is in the manifest, in the class
        # files, in javadoc HTML, or in ZIP entry order — each of
        # those points at a different reproducibility knob.
        if: ${{ failure() }}
        run: |
          set -u
          mkdir -p diag
          for f in pass1/*.jar; do
            base=$(basename "$f")
            stem="${base%.jar}"
            echo "=== ${stem}: cmp ==="
            cmp "pass1/${base}" "pass2/${base}" || true
            echo "=== ${stem}: zip listing diff ==="
            unzip -lqq "pass1/${base}" | LC_ALL=C sort > "diag/${stem}.p1.list" || true
            unzip -lqq "pass2/${base}" | LC_ALL=C sort > "diag/${stem}.p2.list" || true
            diff -u "diag/${stem}.p1.list" "diag/${stem}.p2.list" | head -60 || true
            echo "=== ${stem}: MANIFEST.MF diff ==="
            unzip -p "pass1/${base}" META-INF/MANIFEST.MF > "diag/${stem}.p1.mf" 2>/dev/null || true
            unzip -p "pass2/${base}" META-INF/MANIFEST.MF > "diag/${stem}.p2.mf" 2>/dev/null || true
            diff -u "diag/${stem}.p1.mf" "diag/${stem}.p2.mf" || true
          done
          for f in pass1/*.pom pass1/*.module; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            echo "=== ${base}: diff ==="
            diff -u "pass1/${base}" "pass2/${base}" | head -60 || true
          done

      - name: Assemble release directory
        # Sign pass1's bytes — identical to pass2 by the bit-
        # compare above, so the choice is arbitrary.
        run: |
          set -eu
          mkdir -p release
          cp pass1/* release/
          cd release
          ls -1 | LC_ALL=C sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: SLSA build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          # Glob covers jar / pom / module; SHA256SUMS is excluded
          # because attest-build-provenance includes its own hash
          # in the attestation, and SHA256SUMS lists those hashes
          # itself — circular and unnecessary.
          subject-path: |
            release/*.jar
            release/*.pom
            release/*.module

      - name: Install cosign
        # The builder image's apt set is derived from the Maven
        # build trace, which never invokes cosign. Install it from
        # the GitHub releases endpoint with SHA256 verification.
        # Same version as build-container.yml so the signing tool
        # is pinned consistently across the pipeline.
        run: |
          set -euo pipefail
          COSIGN_VERSION=v3.0.6
          COSIGN_SHA256=c956e5dfcac53d52bcf058360d579472f0c1d2d9b69f55209e256fe7783f4c74
          curl -fsSL \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" \
            -o /usr/local/bin/cosign
          echo "${COSIGN_SHA256}  /usr/local/bin/cosign" | sha256sum -c -
          chmod +x /usr/local/bin/cosign

      - name: Sign each artifact with cosign
        env:
          COSIGN_YES: 'true'
        run: |
          set -euo pipefail
          for f in release/*; do
            [ -f "${f}" ] || continue
            case "${f}" in
              *.sigstore|release/SHA256SUMS) continue ;;
            esac
            cosign sign-blob --bundle "${f}.sigstore" --new-bundle-format "${f}"
          done
          ls -la release/

      - name: Upload verified artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: release/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Create draft release
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Only job with write access — actually creates the release.
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Derive SOURCE_DATE_EPOCH for release notes
        id: meta
        run: |
          set -eu
          SDE=$(git log -1 --format=%ct "${GITHUB_REF_NAME}")
          ISO_TS=$(date -u -d "@${SDE}" '+%Y-%m-%dT%H:%M:%SZ')
          {
            echo "sde=${SDE}"
            echo "iso_ts=${ISO_TS}"
          } >> "$GITHUB_OUTPUT"

      - name: Download verified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: release

      - name: Determine release name
        id: name
        # The release name is the tag stripped of common prefixes.
        # `rel/commons-lang-3.18.0` → `commons-lang-3.18.0`,
        # `v1.2.3` → `1.2.3`. Used only in the GitHub release UI;
        # artifact filenames are unaffected.
        run: |
          set -eu
          NAME="${GITHUB_REF_NAME#rel/}"
          NAME="${NAME#v}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        env:
          NAME: ${{ steps.name.outputs.name }}
          SDE: ${{ steps.meta.outputs.sde }}
          ISO_TS: ${{ steps.meta.outputs.iso_ts }}
          # workflow_ref embeds the tag name, which a compromised
          # maintainer could shape to inject shell. Pipe through
          # env so the shell sees a bare variable, not a template
          # expansion.
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -eu
          main_artifacts() {
            ls -1 release \
              | grep -v '\.sigstore$' \
              | grep -v '^SHA256SUMS$' \
              | LC_ALL=C sort
          }
          {
            echo "## Release ${NAME}"
            echo
            echo "Produced by an automated GitHub Actions workflow from the"
            echo "tagged commit. Every artifact is reproducible bit-for-bit"
            echo "(verified by independent two-pass build) and signed by"
            echo "the workflow's OIDC identity."
            echo
            echo "**This release is currently a DRAFT.** The maintainer may"
            echo "optionally sign each artifact with their GPG key and"
            echo "attach the resulting \`.asc\` files before publishing."
            echo
            echo "### Build provenance"
            echo
            echo "- **Commit:**              \`${GITHUB_SHA}\`"
            echo "- **Tag:**                 \`${GITHUB_REF_NAME}\`"
            echo "- **SOURCE_DATE_EPOCH:**   \`${SDE}\` (\`${ISO_TS}\`)"
            echo "- **Builder image:**       \`ghcr.io/{{LOWERCASE_REPO}}/builder@sha256:{{BUILDER_DIGEST}}\`"
            echo "- **Workflow:**            \`${WORKFLOW_REF}\`"
            echo
            echo "### Checksums"
            echo
            echo '```'
            cat release/SHA256SUMS
            echo '```'
            echo
            echo "### Verifying"
            echo
            echo "**SLSA provenance (needs the \`gh\` CLI):**"
            echo '```'
            while read -r base; do
              echo "gh attestation verify ${base} \\"
              echo "    --repo ${{ github.repository }} \\"
              echo "    --signer-workflow ${{ github.repository }}/.github/workflows/release.yml"
            done < <(main_artifacts)
            echo '```'
            echo
            echo "**cosign detached signature (works without \`gh\`):**"
            echo '```'
            while read -r base; do
              echo "cosign verify-blob \\"
              echo "    --bundle ${base}.sigstore --new-bundle-format \\"
              echo "    --certificate-identity \\"
              echo "      'https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}' \\"
              echo "    --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\"
              echo "    ${base}"
            done < <(main_artifacts)
            echo '```'
            echo
            echo "**GPG (after the maintainer publishes):**"
            echo '```'
            while read -r base; do
              echo "gpg --verify ${base}.asc ${base}"
            done < <(main_artifacts)
            echo '```'
          } > release_notes.md

      - name: Create DRAFT release
        env:
          NAME: ${{ steps.name.outputs.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          PRERELEASE=""
          case "${NAME}" in
            *alpha*|*beta*|*rc*|*demo*|*pre*|*-SNAPSHOT*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --title "${NAME}" \
            --notes-file release_notes.md \
            --draft \
            ${PRERELEASE} \
            release/*

      - name: Maintainer action needed
        run: |
          {
            echo "### Draft release created"
            echo
            echo "Optional next step: **sign artifacts with your GPG key and publish.**"
            echo
            echo '```'
            echo "# From a machine with your GPG private key:"
            echo "gh release download ${GITHUB_REF_NAME} -R ${{ github.repository }}"
            echo "for f in *; do"
            echo "  case \"\$f\" in *.sigstore|*.asc|SHA256SUMS) continue ;; esac"
            echo "  [ -f \"\$f\" ] && gpg --detach-sign --armor \"\$f\""
            echo "done"
            echo "gh release upload ${GITHUB_REF_NAME} *.asc -R ${{ github.repository }}"
            echo "gh release edit   ${GITHUB_REF_NAME} --draft=false -R ${{ github.repository }}"
            echo '```'
            echo
            echo "Original artifact bytes are untouched; existing SLSA and"
            echo "cosign signatures remain valid after publication."
          } >> "$GITHUB_STEP_SUMMARY"
