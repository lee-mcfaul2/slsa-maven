# Generated by slsa-maven
# {{GENERATOR_URL}} @ {{GENERATOR_SHA}}
#
# Reproducible release workflow for a Maven project. Supports both
# single-module and multi-module reactors transparently — discover
# walks the pom hierarchy and emits per-module matrix entries.
#
# For each module in the default-active reactor (no `-P` profiles),
# produces up to five standard Maven release artifacts:
#   - <artifactId>-<version>.jar
#   - <artifactId>-<version>-sources.jar
#   - <artifactId>-<version>-javadoc.jar
#   - <artifactId>-<version>.pom
#   - <artifactId>-<version>.module    (only if the project
#                                       declares the
#                                       gradle-module-metadata-
#                                       maven-plugin)
#
# A `pom`-packaged module (the reactor root, BOM modules,
# aggregator parents) only emits the .pom; no jar/sources/javadoc.
#
# Each module is built TWICE in independent containers — one pair
# per (module, pass=1|2) — and the two passes are byte-compared
# per artifact. Each verified artifact is then signed two ways
# (SLSA build provenance + cosign detached bundle). Published as a
# DRAFT release; the maintainer may add a GPG signature locally
# before flipping to published.
#
# Job graph:
#
#   test
#     └─ discover
#          ├─ build (matrix: module × pass=1|2) ──┐
#          │                                       │
#          └─────────────────────────────────────→ verify (matrix: module)
#                                                    │
#                                                    └─ publish
#
# The build matrix has up to 2N entries (N = module count); verify
# has up to N. GitHub Actions caps a matrix at 256 jobs, so the
# release workflow supports projects with N ≤ 128 modules in the
# default reactor. Discover fails fast with a clear error if
# exceeded.
#
# Why one job per (module, pass) instead of (module, artifact, pass)?
# A keycloak-scale project has ~100 modules × 5 artifacts × 2 passes
# = ~1000 entries — far over the 256 matrix cap. Consolidating the
# artifact axis into a single per-module build job (which produces
# all five artifacts inside one container) keeps the per-pass
# independence — the load-bearing SLSA-style "build twice
# independently" property — at the cost of per-artifact build
# isolation. Per-artifact bit-compare is still done in verify.
#
# Reproducibility envelope (same as single-module today):
#   - SOURCE_DATE_EPOCH from `git log -1 --format=%ct <tag>`,
#     exported to $GITHUB_ENV in every job so any process-
#     inherited shell-out (gzip / tar / jar tool) honors it.
#   - -Dproject.build.outputTimestamp=<ISO-8601(SDE)> overrides
#     whatever the pom committed; stale pom timestamps can't drift
#     between pass1 and pass2.
#   - -Dnotimestamp=true on the javadoc plugin, suppressing the
#     dc.created HTML <meta>.
#   - mvn -o (offline) — the builder image carries the entire
#     local repo; nothing reaches the network mid-build.
#
# Verifying a published release:
#
#   gh attestation verify <artifact> \
#       --repo <owner>/<repo> \
#       --signer-workflow <owner>/<repo>/.github/workflows/release.yml
#
#   cosign verify-blob \
#       --bundle <artifact>.sigstore --new-bundle-format \
#       --certificate-identity \
#         'https://github.com/<owner>/<repo>/.github/workflows/release.yml@refs/tags/<tag>' \
#       --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
#       <artifact>
#
#   gpg --verify <artifact>.asc <artifact>     # if maintainer GPG-signed

name: Release

on:
  push:
    # Permissive tag matcher — projects use whatever scheme their
    # upstream already uses. Apache Commons style is
    # `rel/commons-lang-3.18.0`; semver-style is `v1.2.3` or
    # `1.2.3`. Version derivation below tolerates all three.
    tags:
      - 'v*'
      - '[0-9]*'
      - 'rel/*'

permissions: {}

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/{{LOWERCASE_REPO}}/builder@sha256:{{BUILDER_DIGEST}}
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Mark workspace safe for git (pre-checkout)
        shell: sh
        run: git config --global --add safe.directory '*'

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Derive SOURCE_DATE_EPOCH
        # SDE drives every reproducibility knob downstream. Source
        # it from the TAG commit, not the workflow run, so a
        # release built today and a release rebuilt next year
        # produce the same bytes. Export to $GITHUB_ENV so any
        # process Maven shells out to (jar tool, gzip, tar) sees
        # the env var natively.
        id: meta
        run: |
          set -eu
          SDE=$(git log -1 --format=%ct "${GITHUB_REF_NAME}")
          echo "sde=${SDE}" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=${SDE}" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH = ${SDE} ($(date -u -d @${SDE} '+%Y-%m-%dT%H:%M:%SZ'))"

      - name: Run reactor verify offline
        # mvn -o forces offline mode. The builder image carries the
        # full pre-resolved local repo at /root/.m2/repository, so
        # offline succeeds without network. -B = batch mode, no
        # ANSI / progress spinner.
        # `verify` is the broadest pre-release gate: compile +
        # test (Surefire) + package + integration-test (Failsafe)
        # + verify-phase plugins (Enforcer rules etc). For
        # multi-module reactors, mvn applies these phases to every
        # project in topological order — single command covers the
        # whole reactor.
        # -Drat.skip=true mirrors the same skip in scan.yml's
        # BUILD_CMD: license headers are project CI's concern,
        # not part of the release contract.
        run: |
          set -euo pipefail
          mvn -o -B -Drat.skip=true verify

  # Walk the pom hierarchy and emit a JSON matrix describing every
  # module in the default reactor. Profile-activated modules are
  # intentionally NOT included — the release pipeline ships only
  # what would be built without explicit profile activation, which
  # matches scan.yml's contract.
  discover:
    name: Discover modules
    needs: test
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/{{LOWERCASE_REPO}}/builder@sha256:{{BUILDER_DIGEST}}
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      build_matrix: ${{ steps.discover.outputs.build_matrix }}
      verify_matrix: ${{ steps.discover.outputs.verify_matrix }}
      module_count: ${{ steps.discover.outputs.module_count }}

    steps:
      - name: Mark workspace safe for git (pre-checkout)
        shell: sh
        run: git config --global --add safe.directory '*'

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Walk reactor and emit matrix
        id: discover
        # XPath uses local-name() to handle the default
        # xmlns="http://maven.apache.org/POM/4.0.0" namespace
        # without coupling to its URI. xmllint and jq come from the
        # builder image (added to scan.yml's always-required apt
        # set so they're pinned in the image).
        run: |
          set -euo pipefail

          xp_string() {
            xmllint --xpath "string($2)" "$1" 2>/dev/null || true
          }

          xp_module_dirs() {
            xmllint --xpath '/*[local-name()="project"]/*[local-name()="modules"]/*[local-name()="module"]' "$1" 2>/dev/null \
              | sed -nE 's#<module>([^<]+)</module>#\1#p' \
              | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          }

          # Recursive walk. Emits one pipe-separated record per
          # module:  <mvn_path>|<artifact_id>|<version>|<packaging>
          walk() {
            local dir="$1" rel="$2"
            local pom="$dir/pom.xml"

            if [ ! -f "$pom" ]; then
              echo "ERROR: missing pom.xml at $dir" >&2
              return 1
            fi

            local artifact_id version packaging
            artifact_id=$(xp_string "$pom" '/*[local-name()="project"]/*[local-name()="artifactId"]')
            # Project's own version, falling back to the parent's.
            # Maven inherits version from <parent> when
            # /project/version is absent. Most multi-module
            # reactors use the inherited form.
            version=$(xp_string "$pom" '/*[local-name()="project"]/*[local-name()="version"]')
            if [ -z "$version" ]; then
              version=$(xp_string "$pom" '/*[local-name()="project"]/*[local-name()="parent"]/*[local-name()="version"]')
            fi
            packaging=$(xp_string "$pom" '/*[local-name()="project"]/*[local-name()="packaging"]')
            [ -z "$packaging" ] && packaging="jar"

            if [ -z "$artifact_id" ]; then
              echo "ERROR: no artifactId in $pom" >&2
              return 1
            fi
            if [ -z "$version" ]; then
              echo "ERROR: no version (project or parent) in $pom" >&2
              return 1
            fi

            # Refuse SNAPSHOT versions. Release pipeline ships
            # immutable bytes; -SNAPSHOT is mutable by Maven
            # convention. The same check fires in scan.yml against
            # resolved dependency versions; this fires against the
            # project's own modules.
            case "$version" in
              *-SNAPSHOT)
                echo "ERROR: $rel ($artifact_id) is at $version (-SNAPSHOT)." >&2
                echo "       Release pipeline rejects mutable versions; bump to a non-SNAPSHOT release before tagging." >&2
                return 1
                ;;
            esac

            # Reject unsupported packaging early with a clear
            # message instead of failing later in the build step.
            case "$packaging" in
              jar|maven-plugin|pom) ;;
              *)
                echo "ERROR: $rel ($artifact_id) has packaging=$packaging which is not yet supported." >&2
                echo "       Supported: jar, maven-plugin, pom. Add a case branch to release.yml's build step to extend." >&2
                return 1
                ;;
            esac

            echo "${rel}|${artifact_id}|${version}|${packaging}"

            while IFS= read -r child; do
              [ -z "$child" ] && continue
              local child_dir child_rel
              child_dir="$dir/$child"
              if [ "$rel" = "." ]; then
                child_rel="$child"
              else
                child_rel="$rel/$child"
              fi
              walk "$child_dir" "$child_rel"
            done < <(xp_module_dirs "$pom")
          }

          records=$(walk "${GITHUB_WORKSPACE}" ".")
          count=$(echo "$records" | grep -c '|' || true)

          # GitHub Actions caps a matrix at 256 jobs. Build matrix
          # is module × pass, so 2N must fit. Hard-fail at discover
          # rather than letting matrix expansion silently drop
          # entries.
          MAX_MODULES=128
          if [ "$count" -gt "$MAX_MODULES" ]; then
            echo "ERROR: $count modules exceeds the supported cap of $MAX_MODULES." >&2
            echo "       GitHub Actions caps any matrix at 256 jobs;" >&2
            echo "       build matrix is module × pass, so 2 × $count > 256." >&2
            echo "       Sharding support is future work." >&2
            exit 1
          fi
          if [ "$count" -lt 1 ]; then
            echo "ERROR: discover found zero modules. Is pom.xml present at the reactor root?" >&2
            exit 1
          fi

          echo "Discovered $count module(s):"
          echo "$records"

          # Build matrix: one entry per (module, pass).
          build_matrix=$(echo "$records" \
            | awk -F'|' '{
              for (pass = 1; pass <= 2; pass++) {
                printf "%s\t%s\t%s\t%s\t%d\n", $1, $2, $3, $4, pass
              }
            }' \
            | jq -Rsc '
              split("\n") | map(select(length>0)) | map(split("\t")) | map({
                mvn_path: .[0],
                artifact_id: .[1],
                version: .[2],
                packaging: .[3],
                pass: (.[4] | tonumber)
              })
            ')

          # Verify matrix: one entry per module.
          verify_matrix=$(echo "$records" \
            | jq -Rsc '
              split("\n") | map(select(length>0)) | map(split("|")) | map({
                mvn_path: .[0],
                artifact_id: .[1],
                version: .[2],
                packaging: .[3]
              })
            ')

          {
            echo "module_count=${count}"
            echo "build_matrix=${build_matrix}"
            echo "verify_matrix=${verify_matrix}"
          } >> "$GITHUB_OUTPUT"

  # One pair (pass=1 + pass=2) per module. Each matrix entry runs
  # an isolated build of one module's full release-artifact set
  # (jar + sources + javadoc + pom + module-or-sentinel for jar /
  # maven-plugin packaging; just pom for pom packaging). Per-
  # module isolation: a flaky build in one module doesn't taint
  # another's bit-compare.
  #
  # Both passes of a given module share `${GITHUB_WORKSPACE}` as
  # their absolute pwd inside their respective containers — same
  # path in both, so anything that bakes the build path into output
  # bakes the SAME path in both passes by construction.
  #
  # fail-fast: false lets all build entries run to completion even
  # if one fails; the verify entries that depend on each pair
  # report their own bit-compare result independently.
  build:
    name: Build ${{ matrix.artifact_id }} (pass ${{ matrix.pass }})
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.build_matrix) }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/{{LOWERCASE_REPO}}/builder@sha256:{{BUILDER_DIGEST}}
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Mark workspace safe for git (pre-checkout)
        shell: sh
        run: git config --global --add safe.directory '*'

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Need history so we can read the tag commit's timestamp.
          fetch-depth: 0
          persist-credentials: false

      - name: Derive SOURCE_DATE_EPOCH
        id: meta
        run: |
          set -eu
          SDE=$(git log -1 --format=%ct "${GITHUB_REF_NAME}")
          ISO_TS=$(date -u -d "@${SDE}" '+%Y-%m-%dT%H:%M:%SZ')
          {
            echo "sde=${SDE}"
            echo "iso_ts=${ISO_TS}"
          } >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=${SDE}" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.artifact_id }} artifacts
        # Per-packaging mvn pipeline:
        #   pom  — file copy of the module's pom.xml. No mvn
        #          invocation; the released pom is the project's
        #          pom.xml renamed to standard convention. Both
        #          passes producing identical bytes is a
        #          tautology, but the pair is here for the same
        #          audit evidence the others provide.
        #   jar / maven-plugin —
        #     One mvn invocation, three goals:
        #       mvn -o -pl X -am package source:jar javadoc:jar
        #     -pl X -am builds the reduced reactor (X plus its
        #     in-reactor dependency chain). Each goal runs against
        #     every project in that reduced reactor, so source/
        #     javadoc jars are produced for X's deps too — those
        #     just sit in their own target/ dirs and we ignore
        #     them; we only collect X's outputs into dist/.
        #
        #     Why not `install`? scan.yml's BUILD_CMD doesn't pull
        #     maven-install-plugin into the offline cache (verify
        #     phase doesn't bind install:install), so `mvn -o
        #     install` would fail on the offline image. `-am` is
        #     enough — it builds in-reactor deps in place, and
        #     mvn's reactor resolution finds them by their target/
        #     classes without needing them installed to the local
        #     m2 repo.
        #
        #     -DskipTests because the test job already ran the
        #     full reactor verify; running tests again per matrix
        #     entry would multiply wall-time by N modules.
        #
        #     -Dnotimestamp=true suppresses the dc.created HTML
        #     <meta> stamp on javadoc HTML files.
        #
        #     For the reactor root (mvn_path = "."), no -pl flag —
        #     mvn at the root processes the whole reactor in
        #     topological order; the root IS the focal module.
        #
        #     Module file: if the project declares the
        #     gradle-module-metadata-maven-plugin, the package
        #     step produces target/<artifact>-<v>.module; copy
        #     it. Otherwise drop a per-module-prefixed sentinel
        #     file so verify can detect "no .module published"
        #     without filename collisions across modules in the
        #     publish merge.
        env:
          MVN_PATH: ${{ matrix.mvn_path }}
          ARTIFACT_ID: ${{ matrix.artifact_id }}
          VERSION: ${{ matrix.version }}
          PACKAGING: ${{ matrix.packaging }}
          ISO_TS: ${{ steps.meta.outputs.iso_ts }}
        run: |
          set -euo pipefail
          mkdir -p dist

          # -pl/-am only meaningful inside a reactor with multiple
          # modules. For a root-level build (mvn_path = "."), no
          # -pl flag is needed — mvn processes the whole reactor.
          PL_FLAGS=()
          target_dir="target"
          pom_path="pom.xml"
          if [ "$MVN_PATH" != "." ]; then
            PL_FLAGS=(-pl "$MVN_PATH" -am)
            target_dir="$MVN_PATH/target"
            pom_path="$MVN_PATH/pom.xml"
          fi

          case "$PACKAGING" in
            jar|maven-plugin)
              # All three goals in one invocation. -am brings in
              # in-reactor deps (built in place, not installed).
              mvn -o -B \
                  "${PL_FLAGS[@]}" \
                  -DskipTests \
                  -Dproject.build.outputTimestamp="$ISO_TS" \
                  -Dnotimestamp=true \
                  package source:jar javadoc:jar

              # Collect X's outputs only; sources/javadoc jars
              # produced for X's in-reactor deps stay in their
              # own target/ dirs and are ignored.
              cp "$target_dir/$ARTIFACT_ID-$VERSION.jar"         "dist/"
              cp "$target_dir/$ARTIFACT_ID-$VERSION-sources.jar" "dist/"
              cp "$target_dir/$ARTIFACT_ID-$VERSION-javadoc.jar" "dist/"
              cp "$pom_path"                                      "dist/$ARTIFACT_ID-$VERSION.pom"

              # Module file (Gradle Module Metadata): if the
              # project declares the plugin, the package phase
              # already produced target/<artifact>-<v>.module.
              if grep -qE '<artifactId>gradle-module-metadata-maven-plugin</artifactId>' "$pom_path" 2>/dev/null; then
                if [ ! -f "$target_dir/$ARTIFACT_ID-$VERSION.module" ]; then
                  echo "ERROR: gradle-module-metadata-maven-plugin declared but no .module produced." >&2
                  echo "       Check plugin configuration (likely missing <execution> binding)." >&2
                  exit 1
                fi
                cp "$target_dir/$ARTIFACT_ID-$VERSION.module" "dist/"
              else
                # Per-module-prefixed sentinel so the publish step's
                # merge across many modules doesn't collide on a
                # shared MODULE-NOT-PUBLISHED filename.
                touch "dist/$ARTIFACT_ID-$VERSION.MODULE-NOT-PUBLISHED"
              fi
              ;;

            pom)
              # Pom-packaged module: only artifact is the pom.xml
              # itself. No mvn invocation needed.
              cp "$pom_path" "dist/$ARTIFACT_ID-$VERSION.pom"
              ;;

            *)
              # Unreachable — discover already validated packaging.
              echo "ERROR: unsupported packaging $PACKAGING" >&2
              exit 1
              ;;
          esac

          echo "Built $ARTIFACT_ID ($PACKAGING, pass ${{ matrix.pass }}):"
          ls -la dist/

      - name: Upload artifact
        # Per-(module, pass) upload. The corresponding verify
        # matrix entry pulls both passes by artifact_id.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.artifact_id }}-pass${{ matrix.pass }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # Per-module verify: download the module's two passes, byte-
  # compare each artifact, attest provenance, sign with cosign.
  # needs: build waits for ALL build matrix entries to complete
  # before any verify entry starts.
  verify:
    name: Verify ${{ matrix.artifact_id }} (bit-compare + sign)
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.verify_matrix) }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/{{LOWERCASE_REPO}}/builder@sha256:{{BUILDER_DIGEST}}
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    permissions:
      contents: read
      # Publish the SLSA attestation (out-of-band from artifacts).
      attestations: write
      # Mint the short-lived OIDC token for keyless sigstore signing.
      id-token: write

    steps:
      - name: Download pass 1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-${{ matrix.artifact_id }}-pass1
          path: pass1

      - name: Download pass 2
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-${{ matrix.artifact_id }}-pass2
          path: pass2

      - name: Bit-compare passes
        # File-set check first — a missing or extra file in either
        # pass would otherwise slip past a per-file diff that
        # iterates over only one side.
        run: |
          set -eu
          (cd pass1 && ls -1 | LC_ALL=C sort) > pass1.list
          (cd pass2 && ls -1 | LC_ALL=C sort) > pass2.list
          if ! diff -u pass1.list pass2.list; then
            echo "FAIL: pass1 and pass2 emitted different file sets for ${{ matrix.artifact_id }}"
            exit 1
          fi
          echo "=== sha256 ==="
          sha256sum pass1/* pass2/*
          echo
          for f in pass1/*; do
            base=$(basename "$f")
            diff -q "pass1/${base}" "pass2/${base}"
          done
          echo "Bit-compare passed for ${{ matrix.artifact_id }}."

      - name: Diagnose differences
        # Only fires on bit-compare failure. Helps an operator see
        # whether the divergence is in the manifest, in the class
        # files, in javadoc HTML, or in ZIP entry order — each of
        # those points at a different reproducibility knob.
        if: ${{ failure() }}
        run: |
          set -u
          mkdir -p diag
          for f in pass1/*; do
            base=$(basename "$f")
            stem="${base%.jar}"
            echo "=== ${stem}: cmp first differing byte ==="
            cmp "pass1/${base}" "pass2/${base}" || true
            # zip listing only meaningful for jars / .module / .pom
            # (.pom is plain XML — unzip exits non-zero, tolerated).
            echo "=== ${stem}: zip listing diff (skipped if not a zip) ==="
            unzip -lqq "pass1/${base}" 2>/dev/null | LC_ALL=C sort > "diag/${stem}.p1.list" || true
            unzip -lqq "pass2/${base}" 2>/dev/null | LC_ALL=C sort > "diag/${stem}.p2.list" || true
            diff -u "diag/${stem}.p1.list" "diag/${stem}.p2.list" | head -60 || true
            echo "=== ${stem}: MANIFEST.MF diff (jars only) ==="
            unzip -p "pass1/${base}" META-INF/MANIFEST.MF > "diag/${stem}.p1.mf" 2>/dev/null || true
            unzip -p "pass2/${base}" META-INF/MANIFEST.MF > "diag/${stem}.p2.mf" 2>/dev/null || true
            diff -u "diag/${stem}.p1.mf" "diag/${stem}.p2.mf" || true
            case "${base}" in
              *.pom)
                echo "=== ${base}: text diff ==="
                diff -u "pass1/${base}" "pass2/${base}" | head -60 || true
                ;;
            esac
          done

      - name: Stage release artifact
        # Sign pass1's bytes — identical to pass2 by the bit-
        # compare above, so the choice is arbitrary. Filter out the
        # MODULE-NOT-PUBLISHED sentinel: it's an audit marker for
        # this verify job, not an artifact we want to publish.
        run: |
          set -eu
          mkdir -p release
          for f in pass1/*; do
            base=$(basename "$f")
            case "${base}" in
              *.MODULE-NOT-PUBLISHED) continue ;;
            esac
            cp "$f" release/
          done
          ls -la release/

      - name: Skip if module produced no release artifacts
        # A pom-packaged module emits exactly one .pom and no
        # sentinel, so this won't trigger for it. The case it
        # guards against is a future packaging type that legitimately
        # has nothing to release.
        id: skip
        run: |
          set -eu
          if [ -z "$(ls -A release/ 2>/dev/null)" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No release artifacts for ${{ matrix.artifact_id }}; verify is a no-op."
          fi

      - name: SLSA build provenance
        if: steps.skip.outputs.skip != 'true'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: release/*

      - name: Install cosign
        # The builder image's apt set is derived from the Maven
        # build trace, which never invokes cosign. Install it from
        # the GitHub releases endpoint with SHA256 verification.
        # Same version as build-container.yml so the signing tool
        # is pinned consistently across the pipeline.
        if: steps.skip.outputs.skip != 'true'
        run: |
          set -euo pipefail
          COSIGN_VERSION=v3.0.6
          COSIGN_SHA256=c956e5dfcac53d52bcf058360d579472f0c1d2d9b69f55209e256fe7783f4c74
          curl -fsSL \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" \
            -o /usr/local/bin/cosign
          echo "${COSIGN_SHA256}  /usr/local/bin/cosign" | sha256sum -c -
          chmod +x /usr/local/bin/cosign

      - name: Sign artifacts with cosign
        if: steps.skip.outputs.skip != 'true'
        env:
          COSIGN_YES: 'true'
        run: |
          set -euo pipefail
          for f in release/*; do
            [ -f "${f}" ] || continue
            case "${f}" in *.sigstore) continue ;; esac
            cosign sign-blob --bundle "${f}.sigstore" --new-bundle-format "${f}"
          done
          ls -la release/

      - name: Upload verified artifacts
        if: steps.skip.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-${{ matrix.artifact_id }}
          path: release/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Create draft release
    # discover is in needs so the release notes can reference its
    # module_count output. needs is not transitive — we have to
    # list every job whose outputs we use.
    needs: [discover, verify]
    # `needs.verify.result` aggregates over all matrix entries:
    # 'success' iff every entry succeeded. Any verify-side failure
    # (bit-compare, signing, attestation) blocks publish.
    if: needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Only job with write access — actually creates the release.
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Derive SOURCE_DATE_EPOCH for release notes
        id: meta
        run: |
          set -eu
          SDE=$(git log -1 --format=%ct "${GITHUB_REF_NAME}")
          ISO_TS=$(date -u -d "@${SDE}" '+%Y-%m-%dT%H:%M:%SZ')
          {
            echo "sde=${SDE}"
            echo "iso_ts=${ISO_TS}"
          } >> "$GITHUB_OUTPUT"

      - name: Download all verified artifacts
        # pattern: 'verified-*' pulls every per-module bundle the
        # verify matrix uploaded; merge-multiple flattens them into
        # release/ so all per-module files (plus their .sigstore
        # bundles) live side-by-side for the release upload.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: verified-*
          path: release
          merge-multiple: true

      - name: Determine release name
        id: name
        # Strip common tag prefixes for the GitHub release UI.
        # `rel/commons-lang-3.18.0` → `commons-lang-3.18.0`,
        # `v1.2.3` → `1.2.3`. Artifact filenames are unaffected.
        run: |
          set -eu
          NAME="${GITHUB_REF_NAME#rel/}"
          NAME="${NAME#v}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Regenerate SHA256SUMS
        # Now that all per-module artifacts are in release/, write a
        # combined SHA256SUMS covering everything except sigstore
        # bundles and the SHA256SUMS file itself.
        run: |
          set -euo pipefail
          cd release
          rm -f SHA256SUMS
          ls -1 \
            | grep -v '\.sigstore$' \
            | grep -v '^SHA256SUMS$' \
            | LC_ALL=C sort \
            | xargs sha256sum > SHA256SUMS
          echo "Release contains $(wc -l < SHA256SUMS) artifacts."

      - name: Build release notes
        env:
          NAME: ${{ steps.name.outputs.name }}
          MODULE_COUNT: ${{ needs.discover.outputs.module_count }}
          SDE: ${{ steps.meta.outputs.sde }}
          ISO_TS: ${{ steps.meta.outputs.iso_ts }}
          # workflow_ref embeds the tag name, which a compromised
          # maintainer could shape to inject shell. Pipe through
          # env so the shell sees a bare variable, not a template
          # expansion.
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -eu
          ARTIFACT_COUNT=$(wc -l < release/SHA256SUMS)
          {
            echo "## Release ${NAME}"
            echo
            echo "Produced by an automated GitHub Actions workflow from the"
            echo "tagged commit. Each artifact was built twice in independent"
            echo "containers and byte-compared; every artifact ships with a"
            echo "SLSA build provenance attestation and a cosign detached"
            echo "signature."
            echo
            echo "**This release is currently a DRAFT.** The maintainer may"
            echo "optionally sign each artifact with their GPG key and"
            echo "attach the resulting \`.asc\` files before publishing."
            echo
            echo "### Build provenance"
            echo
            echo "- **Modules released:**     \`${MODULE_COUNT}\`"
            echo "- **Artifacts:**            \`${ARTIFACT_COUNT}\`"
            echo "- **Commit:**               \`${GITHUB_SHA}\`"
            echo "- **Tag:**                  \`${GITHUB_REF_NAME}\`"
            echo "- **SOURCE_DATE_EPOCH:**    \`${SDE}\` (\`${ISO_TS}\`)"
            echo "- **Builder image:**        \`ghcr.io/{{LOWERCASE_REPO}}/builder@sha256:{{BUILDER_DIGEST}}\`"
            echo "- **Workflow:**             \`${WORKFLOW_REF}\`"
            echo
            echo "### Verifying"
            echo
            echo "Each artifact in this release is independently verifiable."
            echo "Replace \`<artifact>\` below with a specific filename from"
            echo "the SHA256SUMS list. **The same commands work for every"
            echo "artifact** — there are ${ARTIFACT_COUNT} artifacts in this"
            echo "release; the SHA256SUMS file lists them all."
            echo
            echo "**SLSA provenance (needs the \`gh\` CLI):**"
            echo '```'
            echo "gh attestation verify <artifact> \\"
            echo "    --repo ${{ github.repository }} \\"
            echo "    --signer-workflow ${{ github.repository }}/.github/workflows/release.yml"
            echo '```'
            echo
            echo "**cosign detached signature (works without \`gh\`):**"
            echo '```'
            echo "cosign verify-blob \\"
            echo "    --bundle <artifact>.sigstore --new-bundle-format \\"
            echo "    --certificate-identity \\"
            echo "      'https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}' \\"
            echo "    --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\"
            echo "    <artifact>"
            echo '```'
            echo
            echo "**GPG (after the maintainer publishes):**"
            echo '```'
            echo "gpg --verify <artifact>.asc <artifact>"
            echo '```'
            echo
            echo "### Checksums"
            echo
            echo '```'
            cat release/SHA256SUMS
            echo '```'
          } > release_notes.md
          echo "Wrote $(wc -l < release_notes.md)-line release_notes.md."

      - name: Create DRAFT release
        env:
          NAME: ${{ steps.name.outputs.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          PRERELEASE=""
          case "${NAME}" in
            *alpha*|*beta*|*rc*|*demo*|*pre*|*-SNAPSHOT*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --title "${NAME}" \
            --notes-file release_notes.md \
            --draft \
            ${PRERELEASE} \
            release/*

      - name: Maintainer action needed
        run: |
          {
            echo "### Draft release created"
            echo
            echo "Optional next step: **sign artifacts with your GPG key and publish.**"
            echo
            echo '```'
            echo "# From a machine with your GPG private key:"
            echo "gh release download ${GITHUB_REF_NAME} -R ${{ github.repository }}"
            echo "for f in *; do"
            echo "  case \"\$f\" in *.sigstore|*.asc|SHA256SUMS) continue ;; esac"
            echo "  [ -f \"\$f\" ] && gpg --detach-sign --armor \"\$f\""
            echo "done"
            echo "gh release upload ${GITHUB_REF_NAME} *.asc -R ${{ github.repository }}"
            echo "gh release edit   ${GITHUB_REF_NAME} --draft=false -R ${{ github.repository }}"
            echo '```'
            echo
            echo "Original artifact bytes are untouched; existing SLSA and"
            echo "cosign signatures remain valid after publication."
          } >> "$GITHUB_STEP_SUMMARY"
